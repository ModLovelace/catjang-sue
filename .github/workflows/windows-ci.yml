name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bundled FFmpeg binary
        run: node .\node_modules\ffmpeg-static\install.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/renderer.js
          node --check editor/editor.js
          node --check hooks/install.js

      - name: Smoke-test source Electron app
        run: npm run smoke -- --user-data-dir=runtime/windows-ci-source

      - name: Build unpacked Windows app
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run pack -- --win --x64

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run dist:win -- --x64

      - name: Validate packaged app
        run: node scripts/test-package.js

      - name: Generate Windows SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-Windows.txt

      - name: Upload Windows installer to artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Catjang-Windows-Installer
          path: |
            dist/*.exe
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error

      - name: Attach Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            gh release upload "${{ github.ref_name }}" $_.FullName --clobber
          }
          gh release upload "${{ github.ref_name }}" dist/SHA256SUMS-Windows.txt --clobber
