name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=optional

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/renderer.js
          node --check editor/editor.js
          node --check hooks/install.js

      - name: Smoke-test source Electron app
        run: npm run smoke -- --user-data-dir=runtime/windows-ci-source

      - name: Build unpacked Windows app
        run: npm run pack -- --win --x64

      - name: Validate packaged app
        shell: pwsh
        run: |
          $ffmpeg = 'dist/win-unpacked/resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe'
          if (!(Test-Path $ffmpeg)) { throw "Packaged FFmpeg is missing: $ffmpeg" }
          & 'dist/win-unpacked/Catjang.exe' --catjang-smoke-test --user-data-dir=runtime/windows-ci-packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
