name: macOS Build (Apple Silicon M1 & Intel)

on:
  push:
    branches:
      - connect-ia-agent
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "main.js"
      - "preload.js"
      - "renderer/**"
      - "package.json"
      - ".github/workflows/mac-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG & ZIP (arm64 / x64)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages (Apple Silicon M1/M2/M3/M4 & Intel)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List generated packages
        run: ls -lh dist/

      - name: Generate macOS SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS-macOS.txt

      - name: Upload macOS installers to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Catjang-macOS-Installers
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-macOS.txt
          if-no-files-found: error

      - name: Attach macOS installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/*.dmg dist/*.zip dist/SHA256SUMS-macOS.txt --clobber
          else
            gh release create "${{ github.ref_name }}" dist/*.dmg dist/*.zip dist/SHA256SUMS-macOS.txt --title "Catjang ${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}"
          fi
