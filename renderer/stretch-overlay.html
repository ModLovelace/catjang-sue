<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catjang Stretch Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stretch-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .mascot-stretch {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(85vw, calc(80vh * (72 / 56)));
      max-width: 90vw;
      max-height: 82vh;
      aspect-ratio: 72 / 56;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 10px 36px rgba(0, 0, 0, 0.45));
      animation: stretch-pop-in 260ms cubic-bezier(0.18, 0.89, 0.32, 1.25);
    }
    @keyframes stretch-pop-in {
      0% {
        transform: translate(-50%, -50%) scale(0.88);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="stretch-container" id="stretch-container"></div>
  <script>
    "use strict";
    const params = new URLSearchParams(window.location.search);
    const mascot = params.get("mascot") || "cat";
    const container = document.getElementById("stretch-container");

    const svgPath = mascot === "cat"
      ? "../svg/cat/stretch.svg"
      : `../svg/${mascot}/stretch.svg`;

    const obj = document.createElement("object");
    obj.id = "mascot-stretch-object";
    obj.className = "mascot-stretch";
    obj.type = "image/svg+xml";
    obj.data = svgPath;
    obj.setAttribute("aria-label", `${mascot}-stretch`);

    if (mascot === "cat") {
      obj.addEventListener("load", () => {
        try {
          const doc = obj.contentDocument;
          if (doc && doc.documentElement) {
            doc.documentElement.classList.add("stretching");
          }
        } catch (e) {}
      });
    }

    container.appendChild(obj);
  </script>
</body>
</html>
