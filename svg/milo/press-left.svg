<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="milo-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="dog-content" filter="url(#milo-outline)">
    <!-- Wagging Tail (high and happy) -->
    <rect x="29" y="15" width="4" height="4" fill="#A86F3E" rx="1"/>
    <rect x="31" y="14" width="3" height="3" fill="#FAF8F5"/>
    <rect x="28" y="19" width="3" height="4" fill="#8F5A2C"/>

    <!-- Chunky Body with Caramel Patch -->
    <rect x="14" y="18" width="17" height="15" fill="#FAF8F5"/>
    <rect x="21" y="17" width="10" height="12" fill="#A86F3E"/>
    <rect x="23" y="19" width="6" height="5" fill="#8F5A2C"/>
    <rect x="15" y="24" width="1" height="1" fill="#C29B77"/>
    <rect x="17" y="27" width="1" height="1" fill="#C29B77"/>
    <rect x="25" y="29" width="6" height="5" fill="#E2DDD0"/>

    <!-- Silver Metal Chain Link Collar -->
    <rect x="12" y="16" width="15" height="2" fill="#C8CBD0"/>
    <rect x="13" y="16" width="2" height="2" fill="#8E939C"/>
    <rect x="17" y="16" width="2" height="2" fill="#8E939C"/>
    <rect x="21" y="16" width="2" height="2" fill="#8E939C"/>

    <!-- Keyboards (Retro dual setup) -->
    <!-- Left keyboard -->
    <path d="M4 33V32H5V31H18V32H19V35H18V38H17V40H16V42H1V41H0V39H1V37H2V35H3V33H4Z" fill="#999797"/>
    <path d="M0 41H1V42H16V44H15H2V43H1V42H0V41Z" fill="#605E5E"/>
    <rect x="2" y="41" width="13" height="1" fill="#D7D6D6"/>
    <!-- Right keyboard -->
    <path d="M24 29V28H25V27H38V28H39V31H38V34H37V36H36V38H21V37H20V35H21V33H22V31H23V29H24Z" fill="#999797"/>
    <path d="M20 37H21V38H36V40H35H22V39H21V38H20V37Z" fill="#605E5E"/>

    <!-- Left Paw DOWN on keyboard (with freckles) -->
    <rect x="8" y="27" width="5" height="8" fill="#FAF8F5"/>
    <rect x="7" y="34" width="6" height="4" fill="#FAF8F5"/>
    <rect x="7" y="37" width="6" height="2" fill="#E2DDD0"/>
    <rect x="9" y="32" width="1" height="1" fill="#C29B77"/>
    <rect x="10" y="35" width="1" height="1" fill="#C29B77"/>

    <!-- Right Paw UP (raised in the air) -->
    <rect x="21" y="20" width="5" height="7" fill="#FAF8F5"/>
    <rect x="21" y="17" width="6" height="4" fill="#FAF8F5"/>
    <rect x="22" y="16" width="5" height="2" fill="#E2DDD0"/>
    <rect x="23" y="18" width="1" height="1" fill="#C29B77"/>

    <!-- Head & Face (Focused on screen) -->
    <rect x="9" y="5" width="15" height="13" fill="#FAF8F5"/>
    <rect x="8" y="7" width="18" height="10" fill="#FAF8F5"/>

    <!-- Caramel Eye Patch on Right Eye -->
    <rect x="17" y="5" width="8" height="11" fill="#A86F3E"/>
    <rect x="16" y="8" width="2" height="6" fill="#A86F3E"/>

    <!-- Floppy Caramel Ears -->
    <rect x="5" y="5" width="4" height="4" fill="#A86F3E"/>
    <rect x="4" y="8" width="4" height="6" fill="#A86F3E"/>
    <rect x="5" y="12" width="3" height="3" fill="#8F5A2C"/>

    <rect x="23" y="5" width="4" height="4" fill="#A86F3E"/>
    <rect x="24" y="8" width="4" height="6" fill="#A86F3E"/>
    <rect x="24" y="12" width="3" height="3" fill="#8F5A2C"/>

    <!-- Freckles on White Face Side -->
    <rect x="10" y="8" width="1" height="1" fill="#C29B77"/>
    <rect x="9" y="11" width="1" height="1" fill="#C29B77"/>

    <!-- Eyes (Focused on typing) -->
    <rect x="10" y="9" width="3" height="3" fill="#3D2314" rx="0.5"/>
    <rect x="10" y="9" width="1" height="1" fill="#FFFFFF"/>
    <rect x="19" y="9" width="3" height="3" fill="#2E180A" rx="0.5"/>
    <rect x="19" y="9" width="1" height="1" fill="#FFFFFF"/>

    <!-- Muzzle & Liver Nose -->
    <rect x="12" y="11" width="7" height="6" fill="#FAF8F5"/>
    <rect x="14" y="12" width="4" height="2" fill="#855444" rx="0.5"/>
    <rect x="15" y="15" width="2" height="1" fill="#664433"/>
  </g>
</svg>
