<svg width="72" height="56" viewBox="-6 -2 72 56" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="milo-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes stretch-tail-wag {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(14deg); }
      }
      @keyframes stretch-breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(1px); }
      }
      .stretch-tail {
        transform-origin: 48px 23px;
        animation: stretch-tail-wag 0.3s ease-in-out infinite alternate;
      }
      .stretch-body-anim {
        animation: stretch-breathe 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <g id="dog-content" class="stretch-body-anim" filter="url(#milo-outline)">
    <!-- Tail (high in the air wagging happily) -->
    <g class="stretch-tail">
      <rect x="47" y="21" width="3" height="4" fill="#8F5A2C"/>
      <rect x="49" y="17" width="4" height="4" fill="#A86F3E" rx="1"/>
      <rect x="50" y="13" width="3" height="4" fill="#FAF8F5"/>
    </g>

    <!-- Rear Body (Arched high in downward dog stretch) with Caramel Rump Patch -->
    <rect x="33" y="22" width="16" height="18" fill="#FAF8F5"/>
    <rect x="36" y="20" width="13" height="16" fill="#A86F3E"/>
    <rect x="38" y="22" width="9" height="12" fill="#8F5A2C"/>

    <!-- Hind Legs (Standing tall pushing up) -->
    <rect x="41" y="38" width="5" height="11" fill="#FAF8F5"/>
    <rect x="41" y="49" width="6" height="3" fill="#FAF8F5"/>
    <rect x="46" y="37" width="5" height="12" fill="#A86F3E"/>
    <rect x="46" y="49" width="6" height="3" fill="#FAF8F5"/>

    <!-- Slanted Mid-Back (Sloping down towards floor) with Speckles -->
    <rect x="23" y="26" width="12" height="16" fill="#FAF8F5"/>
    <rect x="25" y="25" width="10" height="3" fill="#FAF8F5"/>
    <rect x="26" y="28" width="1" height="1" fill="#C29B77"/>
    <rect x="29" y="30" width="1" height="1" fill="#C29B77"/>
    <rect x="24" y="34" width="1" height="1" fill="#C29B77"/>

    <!-- Chest Low on Floor -->
    <rect x="17" y="32" width="10" height="12" fill="#FAF8F5"/>
    <rect x="18" y="34" width="8" height="8" fill="#FAF8F5"/>

    <!-- Silver Metal Chain Link Collar around neck -->
    <rect x="16" y="30" width="10" height="2" fill="#C8CBD0"/>
    <rect x="17" y="30" width="2" height="2" fill="#8E939C"/>
    <rect x="21" y="30" width="2" height="2" fill="#8E939C"/>

    <!-- Front Paws (Stretched straight out forward on floor, with speckles) -->
    <rect x="3" y="44" width="18" height="4" fill="#FAF8F5"/>
    <rect x="2" y="46" width="12" height="3" fill="#FAF8F5"/>
    <rect x="2" y="48" width="12" height="1" fill="#E2DDD0"/>
    <rect x="6" y="44" width="1" height="1" fill="#C29B77"/>
    <rect x="11" y="45" width="1" height="1" fill="#C29B77"/>

    <!-- Head Resting Low (Enjoying the stretch) -->
    <rect x="8" y="31" width="14" height="13" fill="#FAF8F5"/>
    <rect x="9" y="30" width="12" height="13" fill="#FAF8F5"/>
    <!-- Caramel Eye Patch on Right Eye -->
    <rect x="15" y="30" width="8" height="11" fill="#A86F3E"/>

    <!-- Floppy Caramel Ears on Floor -->
    <rect x="5" y="31" width="4" height="4" fill="#A86F3E"/>
    <rect x="4" y="34" width="4" height="5" fill="#A86F3E"/>
    <rect x="4" y="39" width="3" height="4" fill="#8F5A2C"/>

    <rect x="19" y="31" width="4" height="4" fill="#A86F3E"/>
    <rect x="20" y="34" width="4" height="5" fill="#A86F3E"/>
    <rect x="20" y="39" width="3" height="4" fill="#8F5A2C"/>

    <!-- Blissful Eyes Closed in Stretch -->
    <rect x="9" y="34" width="3" height="1" fill="#3D2314"/>
    <rect x="10" y="35" width="2" height="1" fill="#3D2314"/>
    <rect x="16" y="34" width="3" height="1" fill="#2E180A"/>
    <rect x="16" y="35" width="2" height="1" fill="#2E180A"/>

    <!-- Snout & Liver Nose -->
    <rect x="11" y="36" width="7" height="5" fill="#FAF8F5"/>
    <rect x="12" y="37" width="4" height="2" fill="#855444" rx="0.5"/>
  </g>
</svg>
