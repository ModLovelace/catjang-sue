<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="milo-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="dog-content" filter="url(#milo-outline)" transform="translate(0, 4)">
    <!-- Tail (coiled low ready to spring) -->
    <rect x="29" y="22" width="4" height="4" fill="#A86F3E" rx="1"/>
    <rect x="31" y="21" width="3" height="3" fill="#FAF8F5"/>
    <rect x="27" y="25" width="3" height="3" fill="#8F5A2C"/>

    <!-- Crouched Chunky Body with Caramel Patch -->
    <rect x="11" y="21" width="19" height="12" fill="#FAF8F5"/>
    <rect x="18" y="20" width="12" height="10" fill="#A86F3E"/>
    <rect x="13" y="24" width="1" height="1" fill="#C29B77"/>
    <rect x="15" y="26" width="1" height="1" fill="#C29B77"/>
    <rect x="20" y="28" width="8" height="5" fill="#E2DDD0"/>

    <!-- Silver Metal Chain Link Collar -->
    <rect x="9" y="19" width="15" height="2" fill="#C8CBD0"/>
    <rect x="10" y="19" width="2" height="2" fill="#8E939C"/>
    <rect x="14" y="19" width="2" height="2" fill="#8E939C"/>
    <rect x="18" y="19" width="2" height="2" fill="#8E939C"/>

    <!-- Crouched Paws (Pressed against floor) -->
    <rect x="9" y="31" width="6" height="4" fill="#FAF8F5"/>
    <rect x="9" y="34" width="6" height="2" fill="#E2DDD0"/>
    <rect x="10" y="32" width="1" height="1" fill="#C29B77"/>

    <rect x="22" y="31" width="6" height="4" fill="#FAF8F5"/>
    <rect x="22" y="34" width="6" height="2" fill="#E2DDD0"/>
    <rect x="24" y="32" width="1" height="1" fill="#C29B77"/>

    <!-- Crouched Head & Caramel Eye Patch -->
    <rect x="8" y="9" width="15" height="13" fill="#FAF8F5"/>
    <rect x="6" y="11" width="19" height="9" fill="#FAF8F5"/>
    <rect x="16" y="9" width="9" height="10" fill="#A86F3E"/>

    <!-- Floppy Ears (Pinned back in anticipation) -->
    <rect x="3" y="9" width="5" height="4" fill="#A86F3E"/>
    <rect x="2" y="12" width="4" height="6" fill="#A86F3E"/>
    <rect x="3" y="17" width="3" height="3" fill="#8F5A2C"/>

    <rect x="21" y="9" width="5" height="4" fill="#A86F3E"/>
    <rect x="23" y="12" width="4" height="6" fill="#A86F3E"/>
    <rect x="23" y="17" width="3" height="3" fill="#8F5A2C"/>

    <!-- Excited Amber Eyes Looking Up -->
    <rect x="9" y="12" width="4" height="4" fill="#3D2314" rx="0.5"/>
    <rect x="10" y="12" width="2" height="2" fill="#5A3B22"/>
    <rect x="10" y="12" width="1" height="1" fill="#FFFFFF"/>

    <rect x="18" y="12" width="4" height="4" fill="#2E180A" rx="0.5"/>
    <rect x="19" y="12" width="2" height="2" fill="#5A3B22"/>
    <rect x="19" y="12" width="1" height="1" fill="#FFFFFF"/>

    <!-- Snout & Liver Nose -->
    <rect x="12" y="14" width="7" height="6" fill="#FAF8F5"/>
    <rect x="13" y="15" width="4" height="2" fill="#855444" rx="0.5"/>
  </g>
</svg>
