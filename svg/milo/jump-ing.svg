<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="milo-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Flying / Leaping Pose inspired by the Oil Painting (Chubby Flying Milo) -->
  <g id="dog-content" filter="url(#milo-outline)" transform="translate(0, -3)">
    <!-- Tail flying high in excitement -->
    <rect x="29" y="10" width="4" height="4" fill="#A86F3E" rx="1"/>
    <rect x="30" y="9" width="3" height="3" fill="#FAF8F5"/>
    <rect x="27" y="14" width="3" height="4" fill="#8F5A2C"/>

    <!-- Plump Belly & Body in Mid-Air Leap -->
    <rect x="12" y="15" width="18" height="13" fill="#FAF8F5"/>
    <rect x="19" y="14" width="11" height="11" fill="#A86F3E"/>
    <rect x="21" y="16" width="6" height="5" fill="#8F5A2C"/>

    <!-- Ticking / Freckles on White Belly (like in the painting!) -->
    <rect x="13" y="18" width="1" height="1" fill="#C29B77"/>
    <rect x="15" y="20" width="1" height="1" fill="#C29B77"/>
    <rect x="14" y="23" width="1" height="1" fill="#C29B77"/>
    <rect x="17" y="22" width="1" height="1" fill="#C29B77"/>
    <rect x="18" y="25" width="1" height="1" fill="#C29B77"/>
    <rect x="22" y="24" width="7" height="4" fill="#E2DDD0"/>

    <!-- Silver Metal Chain Link Collar -->
    <rect x="10" y="13" width="14" height="2" fill="#C8CBD0"/>
    <rect x="11" y="13" width="2" height="2" fill="#8E939C"/>
    <rect x="15" y="13" width="2" height="2" fill="#8E939C"/>
    <rect x="19" y="13" width="2" height="2" fill="#8E939C"/>

    <!-- Front Paws Extended Forward/Spread in Joy (with freckles) -->
    <rect x="7" y="26" width="5" height="7" fill="#FAF8F5"/>
    <rect x="7" y="32" width="5" height="3" fill="#FAF8F5"/>
    <rect x="7" y="34" width="5" height="1" fill="#E2DDD0"/>
    <rect x="8" y="28" width="1" height="1" fill="#C29B77"/>

    <rect x="15" y="26" width="5" height="7" fill="#FAF8F5"/>
    <rect x="15" y="32" width="5" height="3" fill="#FAF8F5"/>
    <rect x="15" y="34" width="5" height="1" fill="#E2DDD0"/>
    <rect x="17" y="29" width="1" height="1" fill="#C29B77"/>

    <!-- Back Paws Extended Backward -->
    <rect x="26" y="25" width="5" height="7" fill="#FAF8F5"/>
    <rect x="27" y="31" width="5" height="3" fill="#FAF8F5"/>
    <rect x="27" y="33" width="5" height="1" fill="#E2DDD0"/>
    <rect x="28" y="27" width="1" height="1" fill="#C29B77"/>

    <!-- Floppy Caramel Ears Flying Up in Joy -->
    <!-- Left Ear flying out -->
    <rect x="3" y="3" width="5" height="4" fill="#A86F3E"/>
    <rect x="2" y="6" width="5" height="5" fill="#A86F3E"/>
    <rect x="2" y="11" width="3" height="3" fill="#8F5A2C"/>
    <!-- Right Ear flying out -->
    <rect x="21" y="3" width="5" height="4" fill="#A86F3E"/>
    <rect x="22" y="6" width="5" height="5" fill="#A86F3E"/>
    <rect x="23" y="11" width="3" height="3" fill="#8F5A2C"/>

    <!-- Head & Caramel Eye Patch -->
    <rect x="7" y="4" width="15" height="12" fill="#FAF8F5"/>
    <rect x="6" y="7" width="17" height="9" fill="#FAF8F5"/>
    <rect x="15" y="4" width="9" height="10" fill="#A86F3E"/>

    <!-- Happy Joyful Eyes -->
    <rect x="8" y="7" width="3" height="3" fill="#3D2314" rx="0.5"/>
    <rect x="8" y="7" width="1" height="1" fill="#FFFFFF"/>
    <rect x="17" y="7" width="3" height="3" fill="#2E180A" rx="0.5"/>
    <rect x="17" y="7" width="1" height="1" fill="#FFFFFF"/>

    <!-- Cute Smiling Snout & Liver Nose -->
    <rect x="10" y="9" width="7" height="5" fill="#FAF8F5"/>
    <rect x="11" y="10" width="4" height="2" fill="#855444" rx="0.5"/>
    <rect x="12" y="13" width="3" height="1" fill="#FF6B8B"/>
  </g>
</svg>
