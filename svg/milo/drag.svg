<svg width="50" height="64" viewBox="-2 -2 50 64" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="milo-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes dog-dangle-legs {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(4deg); }
      }
      @keyframes dog-dangle-tail {
        0%, 100% { transform: rotate(-10deg); }
        50% { transform: rotate(14deg); }
      }
      .dangle-fl {
        transform-origin: 17px 29px;
        animation: dog-dangle-legs 0.45s ease-in-out infinite alternate;
      }
      .dangle-fr {
        transform-origin: 29px 29px;
        animation: dog-dangle-legs 0.45s ease-in-out infinite alternate-reverse;
      }
      .dangle-bl {
        transform-origin: 18px 46px;
        animation: dog-dangle-legs 0.5s ease-in-out infinite alternate;
      }
      .dangle-br {
        transform-origin: 28px 46px;
        animation: dog-dangle-legs 0.5s ease-in-out infinite alternate-reverse;
      }
      .dangle-tail {
        transform-origin: 34px 44px;
        animation: dog-dangle-tail 0.3s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <g id="dog-content" filter="url(#milo-outline)">
    <!-- Scruff fold where cursor holds Milo -->
    <rect x="20" y="20" width="6" height="4" fill="#FAF8F5" rx="1"/>
    <rect x="21" y="19" width="4" height="3" fill="#FAF8F5"/>
    <rect x="20" y="22" width="6" height="1" fill="#E2DDD0"/>

    <!-- Tail dangling -->
    <g class="dangle-tail">
      <rect x="33" y="44" width="3" height="3" fill="#8F5A2C"/>
      <rect x="34" y="46" width="4" height="4" fill="#A86F3E" rx="1"/>
      <rect x="35" y="47" width="2" height="2" fill="#FAF8F5"/>
    </g>

    <!-- Suspended Chunky Body with Caramel Saddle Patch & Speckles -->
    <rect x="16" y="24" width="16" height="23" fill="#FAF8F5"/>
    <rect x="17" y="23" width="13" height="24" fill="#FAF8F5"/>
    <rect x="23" y="24" width="8" height="16" fill="#A86F3E"/>
    <rect x="25" y="26" width="5" height="10" fill="#8F5A2C"/>

    <!-- Speckles on White Belly -->
    <rect x="18" y="28" width="1" height="1" fill="#C29B77"/>
    <rect x="20" y="32" width="1" height="1" fill="#C29B77"/>
    <rect x="19" y="36" width="1" height="1" fill="#C29B77"/>
    <rect x="21" y="40" width="1" height="1" fill="#C29B77"/>
    <rect x="16" y="33" width="2" height="11" fill="#E2DDD0"/>

    <!-- Silver Metal Chain Link Collar -->
    <rect x="14" y="21" width="18" height="2" fill="#C8CBD0"/>
    <rect x="15" y="21" width="2" height="2" fill="#8E939C"/>
    <rect x="19" y="21" width="2" height="2" fill="#8E939C"/>
    <rect x="23" y="21" width="2" height="2" fill="#8E939C"/>
    <rect x="27" y="21" width="2" height="2" fill="#8E939C"/>

    <!-- Dangling Front Legs with Freckles -->
    <!-- Front Left -->
    <g class="dangle-fl">
      <rect x="13" y="29" width="5" height="10" fill="#FAF8F5"/>
      <rect x="12" y="38" width="6" height="4" fill="#FAF8F5"/>
      <rect x="12" y="41" width="6" height="1" fill="#E2DDD0"/>
      <rect x="14" y="32" width="1" height="1" fill="#C29B77"/>
      <rect x="13" y="35" width="1" height="1" fill="#C29B77"/>
    </g>
    <!-- Front Right -->
    <g class="dangle-fr">
      <rect x="29" y="29" width="5" height="10" fill="#FAF8F5"/>
      <rect x="29" y="38" width="6" height="4" fill="#FAF8F5"/>
      <rect x="29" y="41" width="6" height="1" fill="#E2DDD0"/>
      <rect x="31" y="33" width="1" height="1" fill="#C29B77"/>
    </g>

    <!-- Dangling Back Legs -->
    <!-- Back Left -->
    <g class="dangle-bl">
      <rect x="14" y="46" width="5" height="10" fill="#FAF8F5"/>
      <rect x="13" y="55" width="6" height="4" fill="#FAF8F5"/>
      <rect x="13" y="58" width="6" height="1" fill="#E2DDD0"/>
    </g>
    <!-- Back Right -->
    <g class="dangle-br">
      <rect x="27" y="46" width="5" height="10" fill="#FAF8F5"/>
      <rect x="27" y="55" width="6" height="4" fill="#FAF8F5"/>
      <rect x="27" y="58" width="6" height="1" fill="#E2DDD0"/>
    </g>

    <!-- Head & Face (Looking cute and slightly surprised) -->
    <rect x="14" y="5" width="17" height="15" fill="#FAF8F5"/>
    <rect x="12" y="7" width="21" height="12" fill="#FAF8F5"/>
    <!-- Caramel Eye Patch on Right Eye -->
    <rect x="22" y="5" width="10" height="12" fill="#A86F3E"/>

    <!-- Floppy Caramel Ears Hanging Down -->
    <!-- Left Ear -->
    <rect x="9" y="6" width="4" height="4" fill="#A86F3E"/>
    <rect x="8" y="9" width="4" height="6" fill="#A86F3E"/>
    <rect x="8" y="14" width="3" height="3" fill="#8F5A2C"/>
    <!-- Right Ear -->
    <rect x="32" y="6" width="4" height="4" fill="#A86F3E"/>
    <rect x="33" y="9" width="4" height="6" fill="#A86F3E"/>
    <rect x="33" y="14" width="3" height="3" fill="#8F5A2C"/>

    <!-- Big Wide Innocent Amber Eyes -->
    <rect x="15" y="9" width="3" height="4" fill="#3D2314" rx="0.5"/>
    <rect x="15" y="9" width="1" height="1" fill="#FFFFFF"/>
    <rect x="26" y="9" width="3" height="4" fill="#2E180A" rx="0.5"/>
    <rect x="26" y="9" width="1" height="1" fill="#FFFFFF"/>

    <!-- Muzzle & Liver Nose -->
    <rect x="18" y="12" width="9" height="6" fill="#FAF8F5"/>
    <rect x="19" y="13" width="1" height="1" fill="#C29B77"/>
    <rect x="25" y="14" width="1" height="1" fill="#C29B77"/>
    <rect x="20" y="13" width="5" height="3" fill="#855444" rx="0.5"/>
    <rect x="21" y="16" width="3" height="1" fill="#664433"/>
  </g>
</svg>
