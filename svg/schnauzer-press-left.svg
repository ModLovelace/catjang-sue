<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <style>
      #dog-content {
        filter: drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff);
      }
    </style>
  </defs>

  <g id="dog-content">
    <!-- Tail (raised happily) -->
    <rect x="30" y="16" width="3" height="4" fill="#FFFFFF"/>
    <rect x="29" y="19" width="3" height="4" fill="#E0E0E0"/>
    <rect x="27" y="22" width="3" height="4" fill="#444444"/>

    <!-- Body -->
    <rect x="15" y="18" width="16" height="15" fill="#444444"/>
    <rect x="20" y="17" width="10" height="3" fill="#333333"/>
    <rect x="13" y="21" width="5" height="10" fill="#CCCCCC"/>
    <rect x="25" y="31" width="5" height="4" fill="#333333"/>
    <rect x="26" y="34" width="5" height="2" fill="#E0E0E0"/>

    <!-- Keyboards (Retro dual keyboard setup like cat) -->
    <!-- Left keyboard -->
    <path d="M4 33V32H5V31H18V32H19V35H18V38H17V40H16V42H1V41H0V39H1V37H2V35H3V33H4Z" fill="#999797"/>
    <path d="M0 41H1V42H16V44H15H2V43H1V42H0V41Z" fill="#605E5E"/>
    <rect x="2" y="41" width="13" height="1" fill="#D7D6D6"/>
    <!-- Right keyboard -->
    <path d="M24 29V28H25V27H38V28H39V31H38V34H37V36H36V38H21V37H20V35H21V33H22V31H23V29H24Z" fill="#999797"/>

    <!-- Left Paw DOWN (pressing keyboard) -->
    <rect x="8" y="27" width="5" height="8" fill="#444444"/>
    <rect x="7" y="34" width="6" height="4" fill="#E8E8E8"/>
    <rect x="7" y="37" width="6" height="2" fill="#FFFFFF"/>

    <!-- Right Paw UP (raised in the air) -->
    <rect x="22" y="21" width="6" height="7" fill="#444444"/>
    <rect x="22" y="18" width="6" height="4" fill="#E8E8E8"/>
    <rect x="23" y="17" width="5" height="2" fill="#FFFFFF"/>

    <!-- Head & Face -->
    <g transform="translate(1, 1)">
      <!-- Ears -->
      <rect x="6" y="4" width="5" height="4" fill="#333333"/>
      <rect x="5" y="7" width="4" height="4" fill="#444444"/>
      <rect x="19" y="4" width="5" height="4" fill="#333333"/>
      <rect x="21" y="7" width="4" height="4" fill="#444444"/>

      <!-- Head Base -->
      <rect x="9" y="6" width="12" height="12" fill="#555555"/>
      <rect x="8" y="9" width="14" height="9" fill="#444444"/>

      <!-- Bushy Eyebrows -->
      <rect x="7" y="8" width="6" height="3" fill="#E8E8E8"/>
      <rect x="8" y="7" width="4" height="2" fill="#FFFFFF"/>
      <rect x="17" y="8" width="6" height="3" fill="#E8E8E8"/>
      <rect x="18" y="7" width="4" height="2" fill="#FFFFFF"/>

      <!-- Eyes (Excited focus) -->
      <rect x="9" y="11" width="4" height="3" fill="#FFFFFF"/>
      <rect x="10" y="11" width="2" height="3" fill="#1A1A1A"/>
      <rect x="17" y="11" width="4" height="3" fill="#FFFFFF"/>
      <rect x="18" y="11" width="2" height="3" fill="#1A1A1A"/>

      <!-- Snout, Nose & Beard -->
      <rect x="13" y="12" width="4" height="2" fill="#111111"/>
      <rect x="10" y="14" width="10" height="4" fill="#E0E0E0"/>
      <rect x="9" y="15" width="12" height="4" fill="#EEEEEE"/>
      <rect x="10" y="18" width="10" height="4" fill="#FFFFFF"/>
      <rect x="11" y="21" width="8" height="3" fill="#FFFFFF"/>
      <!-- Happy Tongue Out -->
      <rect x="14" y="17" width="3" height="3" fill="#FF7799" rx="1"/>
    </g>
  </g>
</svg>
