<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="musubi-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="cat-content" filter="url(#musubi-outline)" transform="translate(0, 4)">
    <!-- Bushy Tail held low ready to propel -->
    <rect x="29" y="21" width="4" height="4" fill="#261910" rx="1"/>
    <rect x="31" y="20" width="3" height="3" fill="#8B6846"/>
    <rect x="27" y="24" width="4" height="4" fill="#261910"/>

    <!-- Crouched Fluffy Body with Stripes -->
    <rect x="10" y="20" width="20" height="13" fill="#8B6846"/>
    <rect x="16" y="20" width="3" height="10" fill="#261910"/>
    <rect x="21" y="20" width="3" height="11" fill="#261910"/>
    <rect x="26" y="21" width="3" height="9" fill="#261910"/>

    <!-- Mane / Chest Fluff -->
    <rect x="8" y="18" width="14" height="6" fill="#B8956E"/>
    <rect x="10" y="20" width="10" height="5" fill="#D4BA99"/>

    <!-- Crouched Front Paws -->
    <rect x="9" y="31" width="6" height="4" fill="#B8956E"/>
    <rect x="9" y="34" width="6" height="2" fill="#705234"/>
    <rect x="21" y="31" width="6" height="4" fill="#B8956E"/>
    <rect x="21" y="34" width="6" height="2" fill="#705234"/>

    <!-- Crouched Head & Pointed Ears with Tufts -->
    <rect x="8" y="9" width="16" height="13" fill="#8B6846"/>
    <rect x="6" y="11" width="20" height="9" fill="#8B6846"/>

    <!-- Ears (Pinned slightly back before leap) -->
    <rect x="4" y="9" width="5" height="4" fill="#6B4E33"/>
    <rect x="5" y="7" width="3" height="3" fill="#6B4E33"/>
    <rect x="6" y="5" width="1" height="2" fill="#1A1009"/>

    <rect x="21" y="9" width="5" height="4" fill="#6B4E33"/>
    <rect x="22" y="7" width="3" height="3" fill="#6B4E33"/>
    <rect x="23" y="5" width="1" height="2" fill="#1A1009"/>

    <!-- Forehead "M" Marking -->
    <rect x="11" y="9" width="2" height="3" fill="#1A1009"/>
    <rect x="17" y="9" width="2" height="3" fill="#1A1009"/>
    <rect x="14" y="10" width="2" height="2" fill="#1A1009"/>
    <rect x="12" y="11" width="6" height="1" fill="#1A1009"/>

    <!-- Excited Emerald Green Eyes Looking Up -->
    <rect x="9" y="12" width="4" height="4" fill="#1A1009" rx="0.5"/>
    <rect x="10" y="12" width="3" height="3" fill="#43A047"/>
    <rect x="10" y="12" width="2" height="2" fill="#111811"/>
    <rect x="10" y="12" width="1" height="1" fill="#A5D6A7"/>

    <rect x="17" y="12" width="4" height="4" fill="#1A1009" rx="0.5"/>
    <rect x="18" y="12" width="3" height="3" fill="#43A047"/>
    <rect x="18" y="12" width="2" height="2" fill="#111811"/>
    <rect x="18" y="12" width="1" height="1" fill="#A5D6A7"/>

    <!-- Snout & Terracotta Nose -->
    <rect x="12" y="14" width="7" height="6" fill="#B8956E"/>
    <rect x="13" y="15" width="4" height="2" fill="#B85D52" rx="0.5"/>

    <!-- Whiskers -->
    <line x1="4" y1="15" x2="11" y2="16" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
    <line x1="19" y1="16" x2="26" y2="15" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
  </g>
</svg>
