<svg width="50" height="64" viewBox="-2 -2 50 64" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="musubi-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes cat-dangle-legs {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(4deg); }
      }
      @keyframes cat-dangle-tail {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(12deg); }
      }
      .dangle-fl {
        transform-origin: 17px 29px;
        animation: cat-dangle-legs 0.45s ease-in-out infinite alternate;
      }
      .dangle-fr {
        transform-origin: 29px 29px;
        animation: cat-dangle-legs 0.45s ease-in-out infinite alternate-reverse;
      }
      .dangle-bl {
        transform-origin: 18px 46px;
        animation: cat-dangle-legs 0.5s ease-in-out infinite alternate;
      }
      .dangle-br {
        transform-origin: 28px 46px;
        animation: cat-dangle-legs 0.5s ease-in-out infinite alternate-reverse;
      }
      .dangle-tail {
        transform-origin: 33px 44px;
        animation: cat-dangle-tail 0.35s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <g id="cat-content" filter="url(#musubi-outline)">
    <!-- Scruff Fold where picked up -->
    <rect x="20" y="20" width="6" height="4" fill="#8B6846" rx="1"/>
    <rect x="21" y="19" width="4" height="3" fill="#B8956E"/>

    <!-- Bushy Tail dangling -->
    <g class="dangle-tail">
      <rect x="32" y="44" width="4" height="4" fill="#261910"/>
      <rect x="33" y="47" width="5" height="4" fill="#8B6846" rx="1"/>
      <rect x="34" y="50" width="4" height="4" fill="#261910"/>
      <rect x="35" y="53" width="3" height="3" fill="#8B6846"/>
    </g>

    <!-- Suspended Long Fluffy Body with Tabby Stripes -->
    <rect x="15" y="24" width="18" height="23" fill="#8B6846"/>
    <rect x="16" y="23" width="16" height="24" fill="#8B6846"/>

    <!-- Tabby Body Stripes -->
    <rect x="16" y="27" width="4" height="3" fill="#261910"/>
    <rect x="28" y="27" width="4" height="3" fill="#261910"/>
    <rect x="16" y="34" width="4" height="3" fill="#261910"/>
    <rect x="28" y="34" width="4" height="3" fill="#261910"/>
    <rect x="16" y="41" width="4" height="3" fill="#261910"/>
    <rect x="28" y="41" width="4" height="3" fill="#261910"/>

    <!-- Fluffy Mane / Chest Center -->
    <rect x="20" y="22" width="8" height="16" fill="#B8956E"/>
    <rect x="22" y="24" width="4" height="12" fill="#D4BA99"/>

    <!-- Dangling Front Legs -->
    <!-- Front Left -->
    <g class="dangle-fl">
      <rect x="13" y="29" width="5" height="10" fill="#8B6846"/>
      <rect x="12" y="38" width="6" height="4" fill="#B8956E"/>
      <rect x="12" y="41" width="6" height="1" fill="#705234"/>
    </g>
    <!-- Front Right -->
    <g class="dangle-fr">
      <rect x="29" y="29" width="5" height="10" fill="#8B6846"/>
      <rect x="29" y="38" width="6" height="4" fill="#B8956E"/>
      <rect x="29" y="41" width="6" height="1" fill="#705234"/>
    </g>

    <!-- Dangling Back Legs -->
    <!-- Back Left -->
    <g class="dangle-bl">
      <rect x="14" y="46" width="5" height="10" fill="#8B6846"/>
      <rect x="13" y="55" width="6" height="4" fill="#B8956E"/>
      <rect x="13" y="58" width="6" height="1" fill="#705234"/>
    </g>
    <!-- Back Right -->
    <g class="dangle-br">
      <rect x="27" y="46" width="5" height="10" fill="#8B6846"/>
      <rect x="27" y="55" width="6" height="4" fill="#B8956E"/>
      <rect x="27" y="58" width="6" height="1" fill="#705234"/>
    </g>

    <!-- Head & Face (Looking mildly annoyed/dignified) -->
    <rect x="14" y="5" width="18" height="15" fill="#8B6846"/>
    <rect x="13" y="7" width="20" height="12" fill="#8B6846"/>

    <!-- Pointed Ears with Lynx Tufts -->
    <rect x="10" y="5" width="4" height="4" fill="#6B4E33"/>
    <rect x="11" y="3" width="3" height="3" fill="#6B4E33"/>
    <rect x="12" y="1" width="1" height="2" fill="#1A1009"/>

    <rect x="32" y="5" width="4" height="4" fill="#6B4E33"/>
    <rect x="32" y="3" width="3" height="3" fill="#6B4E33"/>
    <rect x="33" y="1" width="1" height="2" fill="#1A1009"/>

    <!-- Forehead "M" Marking -->
    <rect x="18" y="5" width="2" height="3" fill="#1A1009"/>
    <rect x="26" y="5" width="2" height="3" fill="#1A1009"/>
    <rect x="22" y="6" width="2" height="2" fill="#1A1009"/>
    <rect x="20" y="7" width="6" height="1" fill="#1A1009"/>

    <!-- Big Majestic Emerald Eyes Looking Down with Dignity -->
    <rect x="15" y="9" width="4" height="4" fill="#1A1009" rx="0.5"/>
    <rect x="15" y="9" width="3" height="3" fill="#43A047"/>
    <rect x="16" y="9" width="2" height="3" fill="#111811"/>
    <rect x="15" y="9" width="1" height="1" fill="#A5D6A7"/>

    <rect x="26" y="9" width="4" height="4" fill="#1A1009" rx="0.5"/>
    <rect x="26" y="9" width="3" height="3" fill="#43A047"/>
    <rect x="27" y="9" width="2" height="3" fill="#111811"/>
    <rect x="26" y="9" width="1" height="1" fill="#A5D6A7"/>

    <!-- Snout & Terracotta Nose -->
    <rect x="18" y="12" width="10" height="6" fill="#B8956E"/>
    <rect x="21" y="13" width="4" height="2" fill="#B85D52" rx="0.5"/>
    <rect x="21" y="16" width="4" height="1" fill="#261910"/>

    <!-- Whiskers -->
    <line x1="7" y1="13" x2="16" y2="14" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
    <line x1="30" y1="14" x2="39" y2="13" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
  </g>
</svg>
