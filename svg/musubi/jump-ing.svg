<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="musubi-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Graceful Airborne Feline Leap -->
  <g id="cat-content" filter="url(#musubi-outline)" transform="translate(0, -3)">
    <!-- Bushy Tail streaming behind -->
    <rect x="29" y="11" width="4" height="4" fill="#261910" rx="1"/>
    <rect x="30" y="10" width="4" height="3" fill="#8B6846"/>
    <rect x="27" y="15" width="4" height="4" fill="#261910"/>
    <rect x="28" y="19" width="3" height="4" fill="#8B6846"/>

    <!-- Extended Airborne Body with Stripes -->
    <rect x="11" y="14" width="19" height="14" fill="#8B6846"/>
    <rect x="17" y="14" width="3" height="11" fill="#261910"/>
    <rect x="22" y="15" width="3" height="12" fill="#261910"/>

    <!-- Mane / Ruff Fluffing Out -->
    <rect x="9" y="12" width="13" height="5" fill="#B8956E"/>
    <rect x="10" y="14" width="11" height="4" fill="#D4BA99"/>

    <!-- Front Paws Extended Forward/Down -->
    <rect x="7" y="25" width="5" height="7" fill="#8B6846"/>
    <rect x="7" y="31" width="5" height="3" fill="#B8956E"/>
    <rect x="7" y="33" width="5" height="1" fill="#705234"/>

    <rect x="14" y="25" width="5" height="7" fill="#8B6846"/>
    <rect x="14" y="31" width="5" height="3" fill="#B8956E"/>
    <rect x="14" y="33" width="5" height="1" fill="#705234"/>

    <!-- Back Paws Extended Backward -->
    <rect x="25" y="24" width="5" height="7" fill="#8B6846"/>
    <rect x="26" y="30" width="5" height="3" fill="#B8956E"/>
    <rect x="26" y="32" width="5" height="1" fill="#705234"/>

    <!-- Head & Ears with Lynx Tufts -->
    <rect x="7" y="4" width="15" height="12" fill="#8B6846"/>
    <rect x="6" y="7" width="17" height="9" fill="#8B6846"/>

    <!-- Pointed Ears -->
    <rect x="4" y="4" width="4" height="4" fill="#6B4E33"/>
    <rect x="5" y="2" width="3" height="3" fill="#6B4E33"/>
    <rect x="6" y="0" width="1" height="2" fill="#1A1009"/>

    <rect x="19" y="4" width="4" height="4" fill="#6B4E33"/>
    <rect x="19" y="2" width="3" height="3" fill="#6B4E33"/>
    <rect x="20" y="0" width="1" height="2" fill="#1A1009"/>

    <!-- Forehead "M" Marking -->
    <rect x="10" y="4" width="2" height="3" fill="#1A1009"/>
    <rect x="16" y="4" width="2" height="3" fill="#1A1009"/>
    <rect x="13" y="5" width="2" height="2" fill="#1A1009"/>
    <rect x="11" y="6" width="6" height="1" fill="#1A1009"/>

    <!-- Joyful Emerald Green Eyes -->
    <rect x="8" y="7" width="4" height="3" fill="#1A1009" rx="0.5"/>
    <rect x="8" y="7" width="3" height="3" fill="#43A047"/>
    <rect x="9" y="7" width="2" height="3" fill="#111811"/>
    <rect x="8" y="7" width="1" height="1" fill="#A5D6A7"/>

    <rect x="16" y="7" width="4" height="3" fill="#1A1009" rx="0.5"/>
    <rect x="16" y="7" width="3" height="3" fill="#43A047"/>
    <rect x="17" y="7" width="2" height="3" fill="#111811"/>
    <rect x="16" y="7" width="1" height="1" fill="#A5D6A7"/>

    <!-- Snout & Nose -->
    <rect x="10" y="9" width="7" height="5" fill="#B8956E"/>
    <rect x="11" y="10" width="4" height="2" fill="#B85D52" rx="0.5"/>

    <!-- Whiskers -->
    <line x1="3" y1="10" x2="9" y2="11" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
    <line x1="17" y1="11" x2="23" y2="10" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
  </g>
</svg>
