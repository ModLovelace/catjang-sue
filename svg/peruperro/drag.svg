<svg width="50" height="64" viewBox="-2 -2 50 64" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="peruperro-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes peru-dangle-legs {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(5deg); }
      }
      @keyframes peru-dangle-tail {
        0%, 100% { transform: rotate(-10deg); }
        50% { transform: rotate(12deg); }
      }
      .dangle-fl {
        transform-origin: 17px 29px;
        animation: peru-dangle-legs 0.45s ease-in-out infinite alternate;
      }
      .dangle-fr {
        transform-origin: 29px 29px;
        animation: peru-dangle-legs 0.45s ease-in-out infinite alternate-reverse;
      }
      .dangle-bl {
        transform-origin: 18px 46px;
        animation: peru-dangle-legs 0.5s ease-in-out infinite alternate;
      }
      .dangle-br {
        transform-origin: 28px 46px;
        animation: peru-dangle-legs 0.5s ease-in-out infinite alternate-reverse;
      }
      .dangle-tail {
        transform-origin: 34px 44px;
        animation: peru-dangle-tail 0.3s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <g id="dog-content" filter="url(#peruperro-outline)">
    <!-- Scruff hold (Held at top of neck) -->
    <rect x="21" y="14" width="4" height="3" fill="#565C6B"/>
    <rect x="20" y="16" width="6" height="2" fill="#1A1B1F"/>

    <!-- Thin Whippy Tail (Dangling / swinging freely) -->
    <g class="dangle-tail">
      <rect x="33" y="44" width="2" height="3" fill="#565C6B"/>
      <rect x="34" y="41" width="2" height="4" fill="#7A8090"/>
      <rect x="35" y="38" width="2" height="4" fill="#9BA3B2"/>
      <rect x="36" y="35" width="1" height="4" fill="#9BA3B2"/>
    </g>

    <!-- Back Left Leg (Dangling — slim Peruvian) -->
    <g class="dangle-bl">
      <rect x="16" y="44" width="3" height="8" fill="#565C6B"/>
      <rect x="15" y="52" width="4" height="4" fill="#9BA3B2"/>
      <rect x="15" y="56" width="4" height="2" fill="#B0B6C2"/>
    </g>

    <!-- Back Right Leg (Dangling) -->
    <g class="dangle-br">
      <rect x="27" y="44" width="3" height="8" fill="#565C6B"/>
      <rect x="26" y="52" width="4" height="4" fill="#9BA3B2"/>
      <rect x="26" y="56" width="4" height="2" fill="#B0B6C2"/>
    </g>

    <!-- Body (Elongated suspended slim torso — hairless so very sleek) -->
    <rect x="16" y="24" width="14" height="22" fill="#7A8090"/>
    <rect x="18" y="25" width="10" height="19" fill="#565C6B"/>
    <!-- Skin wrinkles on suspended body -->
    <rect x="19" y="28" width="6" height="1" fill="#4A5060"/>
    <rect x="19" y="32" width="6" height="1" fill="#4A5060"/>
    <rect x="19" y="36" width="5" height="1" fill="#4A5060"/>

    <!-- Front Left Slim Leg (Dangling forward) -->
    <g class="dangle-fl">
      <rect x="14" y="28" width="4" height="10" fill="#565C6B"/>
      <rect x="13" y="38" width="5" height="4" fill="#9BA3B2"/>
      <rect x="13" y="42" width="5" height="2" fill="#B0B6C2"/>
    </g>

    <!-- Front Right Slim Leg (Dangling forward) -->
    <g class="dangle-fr">
      <rect x="28" y="28" width="4" height="10" fill="#565C6B"/>
      <rect x="27" y="38" width="5" height="4" fill="#9BA3B2"/>
      <rect x="27" y="42" width="5" height="2" fill="#B0B6C2"/>
    </g>

    <!-- Head (Curious Peruvian face suspended in midair) -->
    <g transform="translate(0, 3)">
      <!-- Left Ear (pointing alert upward) -->
      <rect x="10" y="6" width="4" height="7" fill="#565C6B"/>
      <rect x="11" y="7" width="2" height="5" fill="#7A8090"/>

      <!-- Right Ear -->
      <rect x="32" y="6" width="4" height="7" fill="#565C6B"/>
      <rect x="33" y="7" width="2" height="5" fill="#7A8090"/>

      <!-- Head Base (Wider suspended — wondering look) -->
      <rect x="13" y="7" width="20" height="15" fill="#7A8090"/>
      <rect x="15" y="6" width="16" height="3" fill="#565C6B"/>
      <rect x="17" y="5" width="12" height="2" fill="#4A5060"/>

      <!-- Forehead wrinkles -->
      <rect x="20" y="8" width="6" height="1" fill="#4A5060"/>

      <!-- Almond Eyes (Looking down with wonder) -->
      <rect x="15" y="11" width="5" height="4" fill="#1A1B1F" rx="0.5"/>
      <rect x="16" y="12" width="3" height="3" fill="#2A2B30"/>
      <rect x="16" y="11" width="1" height="1" fill="#FFFFFF"/>

      <rect x="26" y="11" width="5" height="4" fill="#1A1B1F" rx="0.5"/>
      <rect x="27" y="12" width="3" height="3" fill="#2A2B30"/>
      <rect x="27" y="11" width="1" height="1" fill="#FFFFFF"/>

      <!-- Small Button Nose -->
      <rect x="20" y="14" width="6" height="2" fill="#1A1B1F" rx="1"/>

      <!-- Slim Neck -->
      <rect x="16" y="16" width="14" height="4" fill="#7A8090"/>
      <rect x="17" y="18" width="12" height="3" fill="#9BA3B2"/>
    </g>
  </g>
</svg>
