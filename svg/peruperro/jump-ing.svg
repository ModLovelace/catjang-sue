<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="peruperro-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="dog-content" filter="url(#peruperro-outline)" transform="translate(0, -3)">
    <!-- Tail (Flying up — Peruvian tail is thin and whippy in the air) -->
    <rect x="28" y="9" width="1" height="4" fill="#565C6B"/>
    <rect x="27" y="13" width="2" height="4" fill="#7A8090"/>
    <rect x="25" y="17" width="2" height="4" fill="#9BA3B2"/>

    <!-- Body in Leap (Slim elegant Peruvian body airborne) -->
    <rect x="13" y="16" width="16" height="13" fill="#565C6B"/>
    <rect x="16" y="14" width="10" height="3" fill="#4A5060"/>
    <rect x="11" y="19" width="5" height="8" fill="#9BA3B2"/>
    <!-- Skin texture on body -->
    <rect x="17" y="19" width="7" height="1" fill="#4A5060"/>
    <rect x="17" y="22" width="5" height="1" fill="#4A5060"/>

    <!-- Front Slim Paws Extended Forward/Down -->
    <rect x="6" y="26" width="4" height="6" fill="#565C6B"/>
    <rect x="5" y="31" width="5" height="3" fill="#9BA3B2"/>
    <rect x="5" y="33" width="5" height="2" fill="#B0B6C2"/>
    <rect x="13" y="26" width="4" height="6" fill="#565C6B"/>
    <rect x="12" y="31" width="5" height="3" fill="#9BA3B2"/>
    <rect x="12" y="33" width="5" height="2" fill="#B0B6C2"/>

    <!-- Back Slim Paws Extended Backward -->
    <rect x="25" y="25" width="5" height="6" fill="#4A5060"/>
    <rect x="26" y="30" width="5" height="3" fill="#9BA3B2"/>

    <!-- Flying Ears (Forward, alert in the air) -->
    <rect x="4" y="2" width="4" height="7" fill="#565C6B"/>
    <rect x="5" y="3" width="2" height="5" fill="#7A8090"/>

    <rect x="20" y="2" width="4" height="7" fill="#565C6B"/>
    <rect x="21" y="3" width="2" height="5" fill="#7A8090"/>

    <!-- Head -->
    <rect x="8" y="6" width="12" height="11" fill="#7A8090"/>
    <rect x="7" y="9" width="14" height="8" fill="#7A8090"/>
    <rect x="9" y="5" width="10" height="2" fill="#565C6B"/>
    <!-- Wrinkle on forehead -->
    <rect x="11" y="7" width="6" height="1" fill="#4A5060"/>

    <!-- Big Joyful Eyes -->
    <rect x="9" y="9" width="4" height="3" fill="#1A1B1F" rx="0.5"/>
    <rect x="10" y="9" width="2" height="3" fill="#2A2B30"/>
    <rect x="9" y="9" width="1" height="1" fill="#FFFFFF"/>

    <rect x="15" y="9" width="4" height="3" fill="#1A1B1F" rx="0.5"/>
    <rect x="16" y="9" width="2" height="3" fill="#2A2B30"/>
    <rect x="15" y="9" width="1" height="1" fill="#FFFFFF"/>

    <!-- Snout & Nose -->
    <rect x="11" y="11" width="6" height="2" fill="#1A1B1F" rx="1"/>

    <!-- Big Happy Tongue (In the air!) -->
    <rect x="12" y="14" width="4" height="4" fill="#C47A8A" rx="1"/>
    <rect x="13" y="17" width="2" height="2" fill="#A85C6E"/>

    <!-- Slim neck -->
    <rect x="10" y="13" width="8" height="3" fill="#7A8090"/>
  </g>
</svg>
