<svg width="72" height="56" viewBox="-6 -2 72 56" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="peruperro-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes stretch-tail-wag {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(12deg); }
      }
      @keyframes stretch-breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(1px); }
      }
      .stretch-tail {
        transform-origin: 48px 23px;
        animation: stretch-tail-wag 0.3s ease-in-out infinite alternate;
      }
      .stretch-body-anim {
        animation: stretch-breathe 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <g id="dog-content" class="stretch-body-anim" filter="url(#peruperro-outline)">
    <!-- Thin tail (High in the air, wagging during stretch) -->
    <g class="stretch-tail">
      <rect x="47" y="21" width="1" height="4" fill="#565C6B"/>
      <rect x="48" y="17" width="2" height="5" fill="#7A8090"/>
      <rect x="49" y="13" width="2" height="5" fill="#9BA3B2"/>
      <rect x="50" y="9" width="1" height="5" fill="#9BA3B2"/>
    </g>

    <!-- Rear Body (Arched high — Peruvian stretch is dramatic) -->
    <rect x="33" y="22" width="16" height="18" fill="#565C6B"/>
    <rect x="36" y="20" width="12" height="4" fill="#4A5060"/>
    <!-- Back skin wrinkles on arched body -->
    <rect x="37" y="23" width="8" height="1" fill="#4A5060"/>

    <!-- Hind Legs (Standing tall pushing up, slim) -->
    <rect x="41" y="38" width="4" height="11" fill="#565C6B"/>
    <rect x="41" y="49" width="5" height="3" fill="#9BA3B2"/>
    <rect x="46" y="37" width="4" height="12" fill="#4A5060"/>
    <rect x="46" y="49" width="5" height="3" fill="#9BA3B2"/>

    <!-- Slanted Mid-Back (Down towards front) -->
    <rect x="23" y="26" width="12" height="16" fill="#565C6B"/>
    <rect x="25" y="25" width="10" height="3" fill="#4A5060"/>
    <!-- Skin wrinkle on mid-back -->
    <rect x="25" y="28" width="8" height="1" fill="#4A5060"/>

    <!-- Chest/Belly on floor (Slim hairless belly) -->
    <rect x="17" y="32" width="10" height="12" fill="#7A8090"/>
    <rect x="18" y="34" width="8" height="8" fill="#9BA3B2"/>
    <!-- Belly wrinkle -->
    <rect x="19" y="36" width="6" height="1" fill="#7A8090"/>

    <!-- Front Slim Paws (Stretched straight out forward on floor) -->
    <rect x="3" y="44" width="18" height="3" fill="#565C6B"/>
    <rect x="2" y="45" width="12" height="3" fill="#9BA3B2"/>
    <rect x="0" y="46" width="8" height="3" fill="#B0B6C2"/>

    <rect x="5" y="41" width="16" height="4" fill="#4A5060"/>
    <rect x="4" y="42" width="10" height="3" fill="#9BA3B2"/>
    <rect x="3" y="43" width="6" height="3" fill="#B0B6C2"/>

    <!-- Head (Down between paws, relaxed forward, happy stretch) -->
    <g transform="translate(4, 20)">
      <!-- Left Ear (Resting, tilted slightly) -->
      <rect x="11" y="2" width="4" height="7" fill="#565C6B"/>
      <rect x="12" y="3" width="2" height="5" fill="#7A8090"/>

      <!-- Head Base -->
      <rect x="14" y="5" width="14" height="14" fill="#7A8090"/>
      <rect x="16" y="4" width="11" height="3" fill="#565C6B"/>
      <!-- Forehead wrinkle -->
      <rect x="18" y="6" width="6" height="1" fill="#4A5060"/>

      <!-- Eyes (Happy closed crescent eyes ^ ^ — resting blissfully) -->
      <rect x="16" y="10" width="4" height="1" fill="#1A1B1F"/>
      <rect x="15" y="11" width="1" height="1" fill="#1A1B1F"/>
      <rect x="20" y="11" width="1" height="1" fill="#1A1B1F"/>

      <rect x="23" y="10" width="4" height="1" fill="#1A1B1F"/>
      <rect x="22" y="11" width="1" height="1" fill="#1A1B1F"/>
      <rect x="27" y="11" width="1" height="1" fill="#1A1B1F"/>

      <!-- Nose (Small, on floor) -->
      <rect x="19" y="13" width="5" height="2" fill="#1A1B1F"/>

      <!-- Slim neck -->
      <rect x="16" y="15" width="10" height="5" fill="#7A8090"/>
      <rect x="17" y="17" width="8" height="3" fill="#9BA3B2"/>
    </g>
  </g>
</svg>
