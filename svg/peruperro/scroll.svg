<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="peruperro-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="paper-strip-clip">
      <rect id="paper-strip-mask" x="5" y="13" width="11" height="17"/>
    </clipPath>

    <style>
      @keyframes speed-line-a {
        0% { opacity: 0; transform: translateY(-2px); }
        20%, 65% { opacity: 1; }
        100% { opacity: 0; transform: translateY(5px); }
      }
      @keyframes speed-line-b {
        0% { opacity: 0; transform: translateY(1px); }
        20%, 70% { opacity: 1; }
        100% { opacity: 0; transform: translateY(7px); }
      }
      .speed-a {
        animation: speed-line-a 0.34s steps(3, end) infinite;
      }
      .speed-b {
        animation: speed-line-b 0.34s steps(3, end) infinite;
        animation-delay: 0.08s;
      }
      @keyframes scroll-ear-left {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(5deg) translateY(-1px); }
      }
      @keyframes scroll-ear-right {
        0%, 100% { transform: rotate(4deg); }
        50% { transform: rotate(-5deg) translateY(-1px); }
      }
      .scroll-ear-l {
        transform-origin: 23px 8px;
        animation: scroll-ear-left 0.25s steps(2, end) infinite;
      }
      .scroll-ear-r {
        transform-origin: 36px 8px;
        animation: scroll-ear-right 0.25s steps(2, end) infinite;
      }
    </style>
  </defs>

  <!-- Paper Roll on the left -->
  <path d="M13 13H3V14H2V15H1V22H2V23H3V24H4V25H13V24H14V22H15V21H16V17H15V15H14V14H13V13Z" fill="#D9D9D9" stroke="black"/>
  <path d="M8 22H7V23H6V25" stroke="black"/>
  <path id="paper-strip" class="paper-strip" d="M13 13H5V15H6V16H7V17H8V45.5H16V17H15V15H14V14H13V13Z" fill="#D9D9D9" stroke="black" clip-path="url(#paper-strip-clip)"/>

  <!-- Speed lines -->
  <g class="speed-a">
    <path d="M5 29V34.5" stroke="black"/>
    <path d="M18 34V38" stroke="black"/>
  </g>
  <g class="speed-b">
    <path d="M11.5 24V28" stroke="black"/>
    <path d="M14 38V42" stroke="black"/>
  </g>

  <!-- Perro Peruano Body & Actions -->
  <g id="dog-content" filter="url(#peruperro-outline)">
    <!-- Wagging thin tail excitedly -->
    <g transform="translate(36, 30)">
      <animateTransform attributeName="transform" type="rotate" values="10 36 30; -20 36 30; 10 36 30" dur="0.18s" repeatCount="indefinite"/>
      <rect x="0" y="-3" width="1" height="3" fill="#565C6B"/>
      <rect x="1" y="-6" width="2" height="4" fill="#7A8090"/>
      <rect x="2" y="-9" width="1" height="4" fill="#9BA3B2"/>
    </g>

    <!-- Body -->
    <rect x="22" y="24" width="16" height="15" fill="#565C6B"/>
    <rect x="25" y="22" width="12" height="3" fill="#4A5060"/>
    <rect x="20" y="26" width="5" height="10" fill="#9BA3B2"/>
    <!-- Back Paws -->
    <rect x="33" y="38" width="6" height="4" fill="#565C6B"/>
    <rect x="33" y="41" width="6" height="2" fill="#9BA3B2"/>

    <!-- Left slim paw furiously rolling (alternating) -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="rotate" values="24 26 26; -18 26 26; 24 26 26" dur="0.16s" repeatCount="indefinite"/>
      <rect x="18" y="22" width="5" height="10" fill="#565C6B"/>
      <rect x="16" y="28" width="5" height="4" fill="#9BA3B2"/>
      <rect x="16" y="31" width="5" height="4" fill="#B0B6C2"/>
      <rect x="15" y="33" width="5" height="2" fill="#CECFD4"/>
    </g>

    <!-- Right slim paw furiously rolling (alternating) -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="rotate" values="-18 30 27; 24 30 27; -18 30 27" dur="0.16s" repeatCount="indefinite"/>
      <rect x="21" y="23" width="5" height="10" fill="#565C6B"/>
      <rect x="19" y="29" width="5" height="4" fill="#9BA3B2"/>
      <rect x="19" y="32" width="5" height="4" fill="#B0B6C2"/>
      <rect x="18" y="34" width="5" height="2" fill="#CECFD4"/>
    </g>

    <!-- Head & Peruvian face (Facing left toward paper roll) -->
    <g transform="translate(14, 2)">
      <!-- Upright ears with motion -->
      <g class="scroll-ear-l">
        <rect x="7" y="2" width="4" height="7" fill="#565C6B"/>
        <rect x="8" y="3" width="2" height="5" fill="#7A8090"/>
      </g>
      <g class="scroll-ear-r">
        <rect x="18" y="2" width="4" height="7" fill="#565C6B"/>
        <rect x="19" y="3" width="2" height="5" fill="#7A8090"/>
      </g>

      <!-- Head Base -->
      <rect x="9" y="6" width="12" height="12" fill="#7A8090"/>
      <rect x="7" y="8" width="14" height="10" fill="#7A8090"/>
      <rect x="9" y="5" width="10" height="2" fill="#565C6B"/>
      <!-- Forehead wrinkle -->
      <rect x="11" y="7" width="6" height="1" fill="#4A5060"/>

      <!-- Eyes (Excited focus on paper, looking left) -->
      <rect x="8" y="11" width="4" height="3" fill="#1A1B1F" rx="0.5"/>
      <rect x="8" y="11" width="2" height="3" fill="#2A2B30"/>
      <rect x="8" y="11" width="1" height="1" fill="#FFFFFF"/>

      <rect x="16" y="11" width="4" height="3" fill="#1A1B1F" rx="0.5"/>
      <rect x="16" y="11" width="2" height="3" fill="#2A2B30"/>
      <rect x="16" y="11" width="1" height="1" fill="#FFFFFF"/>

      <!-- Small Nose -->
      <rect x="11" y="12" width="5" height="2" fill="#1A1B1F" rx="1"/>

      <!-- Happy tongue out -->
      <rect x="10" y="15" width="3" height="3" fill="#C47A8A" rx="1"/>
      <rect x="11" y="17" width="1" height="1" fill="#A85C6E"/>

      <!-- Slim neck -->
      <rect x="9" y="14" width="10" height="4" fill="#7A8090"/>
    </g>
  </g>
</svg>
