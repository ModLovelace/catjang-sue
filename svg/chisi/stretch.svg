<svg width="72" height="56" viewBox="-6 -2 72 56" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="chisi-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes stretch-tail-wag {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(14deg); }
      }
      @keyframes stretch-breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(1px); }
      }
      .stretch-tail {
        transform-origin: 48px 23px;
        animation: stretch-tail-wag 0.3s ease-in-out infinite alternate;
      }
      .stretch-body-anim {
        animation: stretch-breathe 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <g id="dog-content" class="stretch-body-anim" filter="url(#chisi-outline)">
    <!-- Pompom Tail (High in the air wagging happily) -->
    <g class="stretch-tail">
      <rect x="47" y="21" width="3" height="4" fill="#E6D8BF"/>
      <rect x="49" y="17" width="4" height="4" fill="#FAF6ED" rx="1"/>
      <rect x="50" y="13" width="3" height="4" fill="#FFFFFF"/>
      <rect x="51" y="9" width="3" height="4" fill="#DAB984"/>
    </g>

    <!-- Rear Body (Arched high in downward dog stretch) -->
    <rect x="33" y="22" width="16" height="18" fill="#FAF6ED"/>
    <rect x="36" y="20" width="12" height="4" fill="#FFFFFF"/>
    <rect x="38" y="24" width="8" height="12" fill="#E6D8BF"/>

    <!-- Hind Legs (Standing tall pushing up) -->
    <rect x="41" y="38" width="5" height="11" fill="#FAF6ED"/>
    <rect x="41" y="49" width="6" height="3" fill="#FFFFFF"/>
    <rect x="46" y="37" width="5" height="12" fill="#E6D8BF"/>
    <rect x="46" y="49" width="6" height="3" fill="#FFFFFF"/>

    <!-- Slanted Mid-Back (Sloping down towards floor) -->
    <rect x="23" y="26" width="12" height="16" fill="#FAF6ED"/>
    <rect x="25" y="25" width="10" height="3" fill="#FFFFFF"/>
    
    <!-- Chest Low on Floor -->
    <rect x="17" y="32" width="10" height="12" fill="#FFFFFF"/>
    <rect x="18" y="34" width="8" height="8" fill="#FAF6ED"/>

    <!-- Front Paws (Stretched straight out forward on floor) -->
    <rect x="3" y="44" width="18" height="4" fill="#FAF6ED"/>
    <rect x="2" y="46" width="12" height="3" fill="#FFFFFF"/>
    <rect x="2" y="48" width="12" height="1" fill="#E6D8BF"/>

    <!-- Head Resting Low (Enjoying the stretch) -->
    <rect x="8" y="31" width="14" height="13" fill="#FAF6ED"/>
    <rect x="9" y="30" width="12" height="13" fill="#FAF6ED"/>
    
    <!-- Topknot Curls -->
    <rect x="10" y="27" width="11" height="4" fill="#FFFFFF"/>
    <rect x="12" y="26" width="7" height="3" fill="#FAF6ED"/>

    <!-- Floppy Ears on Floor with Champagne Tips -->
    <rect x="5" y="31" width="4" height="4" fill="#FAF6ED"/>
    <rect x="4" y="34" width="4" height="5" fill="#F0E5D0"/>
    <rect x="3" y="38" width="5" height="5" fill="#E2CCA1"/>
    <rect x="4" y="42" width="4" height="3" fill="#D4BE96"/>

    <rect x="19" y="31" width="4" height="4" fill="#FAF6ED"/>
    <rect x="20" y="34" width="4" height="5" fill="#F0E5D0"/>
    <rect x="20" y="38" width="5" height="5" fill="#E2CCA1"/>
    <rect x="20" y="42" width="4" height="3" fill="#D4BE96"/>

    <!-- Blissful Eyes Closed in Stretch -->
    <rect x="9" y="34" width="3" height="1" fill="#20150F"/>
    <rect x="10" y="35" width="2" height="1" fill="#20150F"/>
    <rect x="16" y="34" width="3" height="1" fill="#20150F"/>
    <rect x="16" y="35" width="2" height="1" fill="#20150F"/>

    <!-- Snout & Button Nose -->
    <rect x="11" y="36" width="6" height="5" fill="#FFFFFF"/>
    <rect x="12" y="37" width="4" height="2" fill="#2B1D16" rx="0.5"/>
  </g>
</svg>
