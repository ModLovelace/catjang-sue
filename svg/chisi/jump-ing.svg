<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="chisi-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="dog-content" filter="url(#chisi-outline)" transform="translate(0, -3)">
    <!-- Pompom Tail Flying High in Joy -->
    <rect x="29" y="11" width="4" height="4" fill="#FAF6ED" rx="1"/>
    <rect x="30" y="10" width="3" height="3" fill="#FFFFFF"/>
    <rect x="31" y="12" width="2" height="2" fill="#DAB984"/>
    <rect x="27" y="15" width="3" height="4" fill="#E6D8BF"/>

    <!-- Body in Mid-Air Leap -->
    <rect x="13" y="15" width="16" height="13" fill="#FAF6ED"/>
    <rect x="15" y="13" width="12" height="3" fill="#FFFFFF"/>
    <rect x="11" y="17" width="5" height="9" fill="#FFFFFF"/>
    <rect x="22" y="24" width="7" height="4" fill="#E6D8BF"/>

    <!-- Front Paws Extended Forward in Celebration -->
    <rect x="8" y="26" width="5" height="7" fill="#FAF6ED"/>
    <rect x="8" y="32" width="5" height="3" fill="#FFFFFF"/>
    <rect x="8" y="34" width="5" height="1" fill="#E6D8BF"/>
    <rect x="15" y="26" width="5" height="7" fill="#FAF6ED"/>
    <rect x="15" y="32" width="5" height="3" fill="#FFFFFF"/>
    <rect x="15" y="34" width="5" height="1" fill="#E6D8BF"/>

    <!-- Back Paws Extended Backward -->
    <rect x="25" y="25" width="5" height="7" fill="#FAF6ED"/>
    <rect x="26" y="31" width="5" height="3" fill="#FFFFFF"/>
    <rect x="26" y="33" width="5" height="1" fill="#E6D8BF"/>

    <!-- Floppy Curly Ears Floating Up in the Air with Champagne Tips -->
    <!-- Left Ear flying out -->
    <rect x="3" y="3" width="5" height="4" fill="#FAF6ED"/>
    <rect x="2" y="6" width="5" height="5" fill="#F0E5D0"/>
    <rect x="1" y="9" width="5" height="5" fill="#E2CCA1"/>
    <rect x="2" y="13" width="4" height="3" fill="#D4BE96"/>
    <!-- Right Ear flying out -->
    <rect x="21" y="3" width="5" height="4" fill="#FAF6ED"/>
    <rect x="22" y="6" width="5" height="5" fill="#F0E5D0"/>
    <rect x="23" y="9" width="5" height="5" fill="#E2CCA1"/>
    <rect x="23" y="13" width="4" height="3" fill="#D4BE96"/>

    <!-- Head & Topknot Curls -->
    <rect x="8" y="4" width="13" height="12" fill="#FAF6ED"/>
    <rect x="7" y="7" width="15" height="9" fill="#FAF6ED"/>
    
    <rect x="8" y="1" width="13" height="4" fill="#FFFFFF"/>
    <rect x="10" y="0" width="9" height="3" fill="#FAF6ED"/>
    <rect x="12" y="0" width="5" height="1" fill="#FFFFFF"/>

    <!-- Happy Joyful Eyes -->
    <rect x="8" y="7" width="3" height="3" fill="#20150F" rx="1"/>
    <rect x="8" y="7" width="1" height="1" fill="#FFFFFF"/>
    <rect x="17" y="7" width="3" height="3" fill="#20150F" rx="1"/>
    <rect x="17" y="7" width="1" height="1" fill="#FFFFFF"/>

    <!-- Cute Smiling Snout & Button Nose -->
    <rect x="11" y="9" width="6" height="5" fill="#FFFFFF"/>
    <rect x="12" y="10" width="4" height="2" fill="#2B1D16" rx="0.5"/>
    <rect x="13" y="13" width="2" height="1" fill="#FF7799"/>
  </g>
</svg>
