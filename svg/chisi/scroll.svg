<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="chisi-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="paper-strip-clip">
      <rect id="paper-strip-mask" x="5" y="13" width="11" height="17"/>
    </clipPath>

    <style>
      @keyframes speed-line-a {
        0% { opacity: 0; transform: translateY(-2px); }
        20%, 65% { opacity: 1; }
        100% { opacity: 0; transform: translateY(5px); }
      }
      @keyframes speed-line-b {
        0% { opacity: 0; transform: translateY(1px); }
        20%, 70% { opacity: 1; }
        100% { opacity: 0; transform: translateY(7px); }
      }
      .speed-a {
        animation: speed-line-a 0.34s steps(3, end) infinite;
      }
      .speed-b {
        animation: speed-line-b 0.34s steps(3, end) infinite;
        animation-delay: 0.08s;
      }
      @keyframes scroll-ear-left {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(8deg) translateY(-1px); }
      }
      @keyframes scroll-ear-right {
        0%, 100% { transform: rotate(4deg); }
        50% { transform: rotate(-8deg) translateY(-1px); }
      }
      .scroll-ear-l {
        transform-origin: 22px 8px;
        animation: scroll-ear-left 0.22s steps(2, end) infinite;
      }
      .scroll-ear-r {
        transform-origin: 38px 8px;
        animation: scroll-ear-right 0.22s steps(2, end) infinite;
      }
      @keyframes scroll-paws-alternating {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      .scroll-paw-l {
        animation: scroll-paws-alternating 0.16s steps(2, end) infinite;
      }
      .scroll-paw-r {
        animation: scroll-paws-alternating 0.16s steps(2, end) infinite;
        animation-delay: 0.08s;
      }
    </style>
  </defs>

  <g id="dog-content" filter="url(#chisi-outline)">
    <!-- Unrolling Paper Roll (Bottom Left) -->
    <g id="paper-roll">
      <!-- Unrolled strip extending down -->
      <g clip-path="url(#paper-strip-clip)">
        <rect x="5" y="13" width="11" height="28" fill="#F4F4F4"/>
        <rect x="5" y="13" width="2" height="28" fill="#E0E0E0"/>
        <rect x="14" y="13" width="2" height="28" fill="#FFFFFF"/>
        <!-- Ruled lines on paper -->
        <line x1="7" y1="18" x2="13" y2="18" stroke="#D0D0D0" stroke-width="1"/>
        <line x1="7" y1="23" x2="13" y2="23" stroke="#D0D0D0" stroke-width="1"/>
        <line x1="7" y1="28" x2="13" y2="28" stroke="#D0D0D0" stroke-width="1"/>
        <line x1="7" y1="33" x2="13" y2="33" stroke="#D0D0D0" stroke-width="1"/>
      </g>
      <!-- Paper Cylinder / Roll top -->
      <rect x="4" y="9" width="13" height="6" fill="#EEEEEE" rx="2"/>
      <rect x="4" y="9" width="4" height="6" fill="#DDDDDD"/>
      <ellipse cx="6" cy="12" rx="1.5" ry="2.5" fill="#AAAAAA"/>
      <rect x="7" y="10" width="9" height="2" fill="#FFFFFF"/>
    </g>

    <!-- Speed Action Lines -->
    <g class="speed-a">
      <rect x="3" y="17" width="1" height="5" fill="#B0B0B0"/>
      <rect x="17" y="20" width="1" height="4" fill="#B0B0B0"/>
    </g>
    <g class="speed-b">
      <rect x="2" y="23" width="1" height="6" fill="#888888"/>
      <rect x="18" y="14" width="1" height="5" fill="#888888"/>
    </g>

    <!-- Chisi Body (Leaning forward over roll) -->
    <!-- Tail (spinning/wagging in excitement) -->
    <rect x="43" y="19" width="4" height="4" fill="#FAF6ED" rx="1"/>
    <rect x="44" y="18" width="3" height="3" fill="#FFFFFF"/>
    <rect x="45" y="20" width="2" height="2" fill="#DAB984"/>
    <rect x="40" y="23" width="4" height="4" fill="#E6D8BF"/>

    <!-- Fluffy Body -->
    <rect x="25" y="18" width="16" height="15" fill="#FAF6ED"/>
    <rect x="27" y="16" width="12" height="4" fill="#FFFFFF"/>
    <rect x="33" y="29" width="7" height="5" fill="#E6D8BF"/>

    <!-- Head & Face (Focused on scrolling) -->
    <rect x="22" y="6" width="14" height="13" fill="#FAF6ED"/>
    <rect x="20" y="8" width="18" height="10" fill="#FAF6ED"/>
    
    <!-- Topknot Curls -->
    <rect x="22" y="3" width="14" height="4" fill="#FFFFFF"/>
    <rect x="24" y="2" width="10" height="3" fill="#FAF6ED"/>
    <rect x="26" y="1" width="6" height="2" fill="#FFFFFF"/>

    <!-- Floppy Curly Ears Flapping with Speed -->
    <g class="scroll-ear-l">
      <rect x="18" y="6" width="4" height="4" fill="#FAF6ED"/>
      <rect x="17" y="9" width="4" height="6" fill="#F0E5D0"/>
      <rect x="16" y="12" width="5" height="5" fill="#E2CCA1"/>
      <rect x="17" y="16" width="4" height="3" fill="#D4BE96"/>
    </g>
    <g class="scroll-ear-r">
      <rect x="35" y="6" width="4" height="4" fill="#FAF6ED"/>
      <rect x="36" y="9" width="4" height="6" fill="#F0E5D0"/>
      <rect x="36" y="12" width="5" height="5" fill="#E2CCA1"/>
      <rect x="36" y="16" width="4" height="3" fill="#D4BE96"/>
    </g>

    <!-- Eyes (Focused intensely down on roll) -->
    <rect x="22" y="11" width="3" height="3" fill="#20150F" rx="1"/>
    <rect x="22" y="12" width="1" height="1" fill="#FFFFFF"/>
    <rect x="31" y="11" width="3" height="3" fill="#20150F" rx="1"/>
    <rect x="31" y="12" width="1" height="1" fill="#FFFFFF"/>

    <!-- Snout & Nose -->
    <rect x="25" y="13" width="6" height="5" fill="#FFFFFF"/>
    <rect x="26" y="14" width="4" height="2" fill="#2B1D16" rx="0.5"/>

    <!-- Alternating Paws Rolling the Paper -->
    <!-- Left Paw -->
    <g class="scroll-paw-l">
      <rect x="12" y="10" width="5" height="5" fill="#FAF6ED"/>
      <rect x="11" y="12" width="6" height="4" fill="#FFFFFF"/>
      <rect x="11" y="14" width="6" height="2" fill="#E6D8BF"/>
    </g>
    <!-- Right Paw -->
    <g class="scroll-paw-r">
      <rect x="16" y="13" width="5" height="5" fill="#FAF6ED"/>
      <rect x="15" y="15" width="6" height="4" fill="#FFFFFF"/>
      <rect x="15" y="17" width="6" height="2" fill="#E6D8BF"/>
    </g>
  </g>
</svg>
