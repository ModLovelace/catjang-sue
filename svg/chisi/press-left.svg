<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="chisi-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="dog-content" filter="url(#chisi-outline)">
    <!-- Pompom Tail (raised high cheerfully) -->
    <rect x="29" y="16" width="4" height="4" fill="#FAF6ED" rx="1"/>
    <rect x="30" y="15" width="3" height="4" fill="#FFFFFF"/>
    <rect x="32" y="17" width="2" height="2" fill="#DAB984"/>
    <rect x="28" y="20" width="3" height="4" fill="#E6D8BF"/>

    <!-- Fluffy Curly Body -->
    <rect x="15" y="18" width="16" height="15" fill="#FAF6ED"/>
    <rect x="19" y="17" width="11" height="3" fill="#FFFFFF"/>
    <rect x="13" y="22" width="6" height="10" fill="#FFFFFF"/>
    <rect x="24" y="29" width="6" height="5" fill="#E6D8BF"/>

    <!-- Keyboards (Retro desktop typing setup) -->
    <!-- Left keyboard -->
    <path d="M4 33V32H5V31H18V32H19V35H18V38H17V40H16V42H1V41H0V39H1V37H2V35H3V33H4Z" fill="#999797"/>
    <path d="M0 41H1V42H16V44H15H2V43H1V42H0V41Z" fill="#605E5E"/>
    <rect x="2" y="41" width="13" height="1" fill="#D7D6D6"/>
    <!-- Right keyboard -->
    <path d="M24 29V28H25V27H38V28H39V31H38V34H37V36H36V38H21V37H20V35H21V33H22V31H23V29H24Z" fill="#999797"/>
    <path d="M20 37H21V38H36V40H35H22V39H21V38H20V37Z" fill="#605E5E"/>

    <!-- Left Curly Paw DOWN (tapping keys) -->
    <rect x="8" y="27" width="5" height="8" fill="#FAF6ED"/>
    <rect x="7" y="34" width="6" height="4" fill="#FFFFFF"/>
    <rect x="7" y="37" width="6" height="2" fill="#E6D8BF"/>

    <!-- Right Curly Paw UP (raised in the air) -->
    <rect x="21" y="20" width="5" height="7" fill="#FAF6ED"/>
    <rect x="21" y="17" width="6" height="4" fill="#FFFFFF"/>
    <rect x="22" y="16" width="5" height="2" fill="#E6D8BF"/>

    <!-- Head & Face (Focused typing expression) -->
    <!-- Head Base -->
    <rect x="10" y="5" width="14" height="13" fill="#FAF6ED"/>
    <rect x="8" y="7" width="18" height="10" fill="#FAF6ED"/>
    
    <!-- Topknot Curls -->
    <rect x="10" y="2" width="14" height="4" fill="#FFFFFF"/>
    <rect x="12" y="1" width="10" height="3" fill="#FAF6ED"/>
    <rect x="14" y="0" width="6" height="2" fill="#FFFFFF"/>
    <rect x="9" y="3" width="3" height="3" fill="#E6D8BF"/>
    <rect x="22" y="3" width="3" height="3" fill="#E6D8BF"/>

    <!-- Floppy Curly Ears with Champagne Tips -->
    <!-- Left Ear -->
    <rect x="6" y="5" width="4" height="4" fill="#FAF6ED"/>
    <rect x="5" y="8" width="4" height="6" fill="#F0E5D0"/>
    <rect x="4" y="11" width="5" height="5" fill="#E2CCA1"/>
    <rect x="5" y="15" width="4" height="3" fill="#D4BE96"/>
    <!-- Right Ear -->
    <rect x="22" y="5" width="4" height="4" fill="#FAF6ED"/>
    <rect x="23" y="8" width="4" height="6" fill="#F0E5D0"/>
    <rect x="23" y="11" width="5" height="5" fill="#E2CCA1"/>
    <rect x="23" y="15" width="4" height="3" fill="#D4BE96"/>

    <!-- Big Eyes looking at screen -->
    <rect x="10" y="9" width="3" height="3" fill="#20150F" rx="1"/>
    <rect x="10" y="9" width="1" height="1" fill="#FFFFFF"/>
    <rect x="19" y="9" width="3" height="3" fill="#20150F" rx="1"/>
    <rect x="19" y="9" width="1" height="1" fill="#FFFFFF"/>

    <!-- Muzzle & Nose -->
    <rect x="13" y="11" width="6" height="5" fill="#FFFFFF"/>
    <rect x="14" y="12" width="4" height="2" fill="#2B1D16" rx="0.5"/>
    <rect x="15" y="15" width="2" height="1" fill="#887060"/>
  </g>
</svg>
