<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="chisi-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="dog-content" filter="url(#chisi-outline)" transform="translate(0, 4)">
    <!-- Pompom Tail (coiled ready to spring) -->
    <rect x="29" y="22" width="4" height="4" fill="#FAF6ED" rx="1"/>
    <rect x="31" y="21" width="3" height="3" fill="#FFFFFF"/>
    <rect x="32" y="23" width="2" height="2" fill="#DAB984"/>
    <rect x="27" y="25" width="3" height="3" fill="#E6D8BF"/>

    <!-- Crouched Body -->
    <rect x="12" y="21" width="18" height="12" fill="#FAF6ED"/>
    <rect x="14" y="19" width="14" height="3" fill="#FFFFFF"/>
    <rect x="10" y="23" width="6" height="8" fill="#FFFFFF"/>
    <rect x="20" y="28" width="8" height="5" fill="#E6D8BF"/>

    <!-- Crouched Paws (Pressed against floor) -->
    <rect x="10" y="31" width="6" height="4" fill="#FFFFFF"/>
    <rect x="10" y="34" width="6" height="2" fill="#E6D8BF"/>
    <rect x="22" y="31" width="6" height="4" fill="#FFFFFF"/>
    <rect x="22" y="34" width="6" height="2" fill="#E6D8BF"/>

    <!-- Crouched Head & Topknot -->
    <rect x="9" y="9" width="14" height="13" fill="#FAF6ED"/>
    <rect x="7" y="11" width="18" height="9" fill="#FAF6ED"/>
    
    <!-- Topknot Curls (slightly flattened in crouch) -->
    <rect x="9" y="6" width="14" height="4" fill="#FFFFFF"/>
    <rect x="11" y="5" width="10" height="3" fill="#FAF6ED"/>
    <rect x="13" y="4" width="6" height="2" fill="#FFFFFF"/>

    <!-- Floppy Ears (Pinned back in anticipation) -->
    <rect x="4" y="9" width="5" height="4" fill="#FAF6ED"/>
    <rect x="3" y="12" width="4" height="6" fill="#F0E5D0"/>
    <rect x="2" y="15" width="5" height="5" fill="#E2CCA1"/>
    <rect x="3" y="18" width="4" height="3" fill="#D4BE96"/>
    <rect x="21" y="9" width="5" height="4" fill="#FAF6ED"/>
    <rect x="23" y="12" width="4" height="6" fill="#F0E5D0"/>
    <rect x="23" y="15" width="5" height="5" fill="#E2CCA1"/>
    <rect x="23" y="18" width="4" height="3" fill="#D4BE96"/>

    <!-- Big Excited Eyes Looking Up -->
    <rect x="9" y="12" width="4" height="4" fill="#20150F" rx="1"/>
    <rect x="10" y="12" width="2" height="2" fill="#FFFFFF"/>
    <rect x="18" y="12" width="4" height="4" fill="#20150F" rx="1"/>
    <rect x="19" y="12" width="2" height="2" fill="#FFFFFF"/>

    <!-- Muzzle & Button Nose -->
    <rect x="12" y="15" width="7" height="5" fill="#FFFFFF"/>
    <rect x="14" y="15" width="4" height="2" fill="#2B1D16" rx="0.5"/>
  </g>
</svg>
