<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="dog-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="dog-content" filter="url(#dog-outline)" transform="translate(0, 4)">
    <!-- Tail (low and coiled) -->
    <rect x="28" y="24" width="3" height="3" fill="#333333"/>
    <rect x="30" y="22" width="3" height="3" fill="#E0E0E0"/>
    <rect x="32" y="20" width="2" height="3" fill="#FFFFFF"/>

    <!-- Crouched Body -->
    <rect x="12" y="22" width="18" height="12" fill="#444444"/>
    <rect x="15" y="20" width="12" height="3" fill="#333333"/>
    <rect x="10" y="24" width="5" height="8" fill="#CCCCCC"/>

    <!-- Crouched Legs -->
    <rect x="10" y="32" width="6" height="4" fill="#444444"/>
    <rect x="10" y="35" width="6" height="2" fill="#E0E0E0"/>
    <rect x="23" y="32" width="6" height="4" fill="#333333"/>
    <rect x="23" y="35" width="6" height="2" fill="#E0E0E0"/>

    <!-- Crouched Head & Face -->
    <!-- Ears -->
    <rect x="5" y="11" width="5" height="3" fill="#333333"/>
    <rect x="4" y="14" width="4" height="4" fill="#444444"/>
    <rect x="19" y="11" width="5" height="3" fill="#333333"/>
    <rect x="21" y="14" width="4" height="4" fill="#444444"/>

    <!-- Head -->
    <rect x="8" y="13" width="13" height="11" fill="#555555"/>
    <rect x="7" y="15" width="15" height="8" fill="#444444"/>

    <!-- Eyebrows (Excited crouch) -->
    <rect x="6" y="14" width="6" height="3" fill="#E8E8E8"/>
    <rect x="16" y="14" width="6" height="3" fill="#E8E8E8"/>

    <!-- Eyes looking up -->
    <rect x="8" y="16" width="4" height="3" fill="#FFFFFF"/>
    <rect x="9" y="15" width="2" height="3" fill="#1A1A1A"/>
    <rect x="16" y="16" width="4" height="3" fill="#FFFFFF"/>
    <rect x="17" y="15" width="2" height="3" fill="#1A1A1A"/>

    <!-- Nose & Beard -->
    <rect x="12" y="18" width="4" height="2" fill="#111111"/>
    <rect x="9" y="20" width="10" height="4" fill="#E0E0E0"/>
    <rect x="8" y="21" width="12" height="4" fill="#EEEEEE"/>
    <rect x="9" y="24" width="10" height="3" fill="#FFFFFF"/>
  </g>
</svg>
