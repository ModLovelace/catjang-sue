<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -10 50 50" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      :root {
        --dog-color: #454952;
        --dog-dark: #2C2F36;
        --dog-light: #ECEFF4;
        --dog-fawn: #D6C3AB;
        --dog-fawn-dark: #B39F87;
        --dog-nose: #141517;
        --dog-outline: #FFFFFF;
      }

      .breathe-anim { transform-origin: 16px 22px; animation: dog-breathe 2.8s infinite ease-in-out; }
      .tail-wag { transform-origin: 24px 28px; animation: dog-tail-wag 1.6s infinite ease-in-out; }
      .ear-twitch-l { transform-origin: 6px 7px; animation: dog-ear-l 7s infinite; }
      .ear-twitch-r { transform-origin: 22px 7px; animation: dog-ear-r 8.5s infinite; }

      @keyframes dog-breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.96) translateY(0.4px); }
      }
      @keyframes dog-tail-wag {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(16deg); }
        75% { transform: rotate(-12deg); }
      }
      @keyframes dog-ear-l {
        0%, 92%, 100% { transform: rotate(0deg); }
        94% { transform: rotate(-8deg); }
        97% { transform: rotate(4deg); }
      }
      @keyframes dog-ear-r {
        0%, 90%, 100% { transform: rotate(0deg); }
        93% { transform: rotate(8deg); }
        96% { transform: rotate(-4deg); }
      }
      @keyframes dog-blink {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
      }

      .eye-l-blink, .eye-r-blink {
        transform-box: fill-box;
        transform-origin: center;
      }
      :root.blinking .eye-l-blink,
      :root.blinking .eye-r-blink {
        animation: dog-blink 0.18s ease-in-out forwards;
      }
      :root.sleeping .eye-l-blink,
      :root.sleeping .eye-r-blink {
        transform: scaleY(0.1);
      }
      @keyframes dog-purr-face {
        0%, 100% { transform: translate(var(--purr-face-x, 0px), var(--purr-face-y, 0px)); }
        50% { transform: translate(var(--purr-face-x, 0px), calc(var(--purr-face-y, 0px) + 0.4px)); }
      }
      :root.purring #face-js {
        animation: dog-purr-face 1.1s steps(2, end) infinite;
      }
      :root.purring .eye-l-blink,
      :root.purring .eye-r-blink {
        transform: scaleY(0.18);
        transition: transform 0.15s ease-out;
      }
      :root.purring .ear-twitch-l {
        transform: rotate(-10deg);
        transition: transform 0.2s ease-out;
      }
      :root.purring .ear-twitch-r {
        transform: rotate(10deg);
        transition: transform 0.2s ease-out;
      }
      :root.purring .tail-wag {
        animation: dog-tail-wag 0.16s infinite ease-in-out;
      }
      #dog-tongue {
        display: none;
      }
      :root.purring #dog-tongue {
        display: block !important;
      }
      .pupil-left, .pupil-right {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.22s ease-out;
      }
    </style>

    <filter id="dog-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="dog-content" filter="url(#dog-outline)">
    <!-- Tail (Short perky puppy tail wagging) -->
    <g class="tail-wag">
      <rect x="24" y="27" width="2" height="3" fill="#2C2F36"/>
      <rect x="25" y="24" width="3" height="4" fill="#454952"/>
      <rect x="26" y="22" width="2" height="3" fill="#9197A3"/>
      <rect x="27" y="20" width="2" height="3" fill="#ECEFF4"/>
    </g>

    <!-- Body Group (Upright puppy posture with dark jacket & fluffy chest/legs) -->
    <g class="breathe-anim">
      <!-- Dark Pepper Jacket on Back/Flanks -->
      <rect x="12" y="19" width="14" height="13" fill="#34373D"/>
      <rect x="14" y="17" width="10" height="3" fill="#2C2F36"/>
      <rect x="20" y="20" width="6" height="11" fill="#2C2F36"/>
      <rect x="13" y="20" width="2" height="11" fill="#454952"/>

      <!-- Silver/White Chest Ruff under beard -->
      <rect x="13" y="20" width="6" height="9" fill="#D6D9E0"/>
      <rect x="14" y="22" width="4" height="6" fill="#ECEFF4"/>

      <!-- Rear Paws (Tucked sitting) -->
      <rect x="22" y="31" width="4" height="4" fill="#34373D"/>
      <rect x="23" y="34" width="4" height="2" fill="#D6D9E0"/>

      <!-- Front Plush Column Legs (Thick, fluffy silvery-cream puppy paws like in photo) -->
      <!-- Left Column Paw -->
      <rect x="10" y="28" width="5" height="7" fill="#D6D9E0"/>
      <rect x="9" y="31" width="6" height="4" fill="#ECEFF4"/>
      <rect x="9" y="34" width="6" height="2" fill="#FFFFFF"/>
      <rect x="11" y="29" width="1" height="4" fill="#B39F87"/>

      <!-- Right Column Paw -->
      <rect x="17" y="28" width="5" height="7" fill="#D6D9E0"/>
      <rect x="17" y="31" width="6" height="4" fill="#ECEFF4"/>
      <rect x="17" y="34" width="6" height="2" fill="#FFFFFF"/>
      <rect x="19" y="29" width="1" height="4" fill="#B39F87"/>
    </g>

    <!-- Head & Distinctive Toto Puppy Face -->
    <g id="face-js">
      <!-- Ears: V-shaped Folded Ears with Characteristic Fawn/Sand Outer Tips (Photo) -->
      <!-- Left Ear -->
      <g class="ear-twitch-l">
        <rect x="5" y="4" width="4" height="3" fill="#2C2F36"/>
        <rect x="4" y="6" width="5" height="5" fill="#454952"/>
        <!-- Fawn / Sand puppy outer tips and edges -->
        <rect x="3" y="6" width="2" height="6" fill="#D6C3AB"/>
        <rect x="4" y="9" width="4" height="4" fill="#D6C3AB"/>
        <rect x="5" y="12" width="3" height="2" fill="#B39F87"/>
      </g>
      <!-- Right Ear -->
      <g class="ear-twitch-r">
        <rect x="19" y="4" width="4" height="3" fill="#2C2F36"/>
        <rect x="19" y="6" width="5" height="5" fill="#454952"/>
        <!-- Fawn / Sand puppy outer tips and edges -->
        <rect x="23" y="6" width="2" height="6" fill="#D6C3AB"/>
        <rect x="20" y="9" width="4" height="4" fill="#D6C3AB"/>
        <rect x="20" y="12" width="3" height="2" fill="#B39F87"/>
      </g>

      <!-- Pepper Grey Crown & Head Base -->
      <rect x="8" y="5" width="12" height="13" fill="#454952"/>
      <rect x="7" y="8" width="14" height="10" fill="#34373D"/>
      <rect x="9" y="5" width="10" height="2" fill="#2C2F36"/>

      <!-- Salt & Pepper Forehead Midtones -->
      <rect x="11" y="7" width="6" height="3" fill="#767C87"/>

      <!-- Prominent Bushy Silvery Eyebrows (Arched gracefully over eyes) -->
      <g id="eyebrows">
        <rect x="6" y="8" width="6" height="3" fill="#D6D9E0"/>
        <rect x="7" y="7" width="5" height="2" fill="#ECEFF4"/>
        <rect x="8" y="6" width="3" height="1" fill="#FFFFFF"/>

        <rect x="16" y="8" width="6" height="3" fill="#D6D9E0"/>
        <rect x="16" y="7" width="5" height="2" fill="#ECEFF4"/>
        <rect x="17" y="6" width="3" height="1" fill="#FFFFFF"/>
      </g>

      <!-- Sweet Round Dark Puppy Eyes (with bright white highlight glint) -->
      <!-- Left Eye -->
      <g id="eye-left" class="eye-l-blink">
        <rect x="8" y="11" width="4" height="3" fill="#141517" rx="0.5"/>
        <rect id="pupil-left" class="pupil-left" x="9" y="11" width="2" height="3" fill="#1C1613"/>
        <rect x="8" y="11" width="1" height="1" fill="#FFFFFF"/><!-- Glint -->
      </g>
      <!-- Right Eye -->
      <g id="eye-right" class="eye-r-blink">
        <rect x="16" y="11" width="4" height="3" fill="#141517" rx="0.5"/>
        <rect id="pupil-right" class="pupil-right" x="17" y="11" width="2" height="3" fill="#1C1613"/>
        <rect x="16" y="11" width="1" height="1" fill="#FFFFFF"/><!-- Glint -->
      </g>

      <!-- Bridge of Snout -->
      <rect x="12" y="11" width="4" height="3" fill="#34373D"/>

      <!-- Big Shiny Button Nose Truffle (Iconic Schnauzer puppy button nose) -->
      <rect id="dog-nose" x="11" y="13" width="6" height="3" fill="#141517" rx="1"/>
      <rect x="12" y="13" width="2" height="1" fill="#34373D"/><!-- Specular -->

      <!-- Tongue (hidden normally, drops out happily on petting) -->
      <rect id="dog-tongue" x="12" y="18" width="4" height="4" fill="#FF6B8B" rx="1"/>
      <rect x="13" y="20" width="2" height="2" fill="#FF4770"/>

      <!-- Signature Rounded White & Silver Beard (Full, bushy, down to chest) -->
      <g id="beard">
        <rect x="8" y="15" width="12" height="4" fill="#D6D9E0"/>
        <rect x="7" y="16" width="14" height="4" fill="#ECEFF4"/>
        <rect x="8" y="19" width="12" height="4" fill="#FFFFFF"/>
        <rect x="9" y="22" width="10" height="3" fill="#FFFFFF"/>
        <rect x="10" y="24" width="8" height="2" fill="#ECEFF4"/>
        <rect x="11" y="25" width="6" height="1" fill="#D6D9E0"/>
        <!-- Soft sand/cream beard highlights on outer cheeks -->
        <rect x="6" y="17" width="2" height="3" fill="#D6C3AB"/>
        <rect x="20" y="17" width="2" height="3" fill="#D6C3AB"/>
      </g>
    </g>
  </g>
</svg>
