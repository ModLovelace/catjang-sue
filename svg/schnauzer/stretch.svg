<svg width="72" height="56" viewBox="-6 -2 72 56" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="dog-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes stretch-tail-wag {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(14deg); }
      }
      @keyframes stretch-breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(1px); }
      }
      .stretch-tail {
        transform-origin: 48px 23px;
        animation: stretch-tail-wag 0.3s ease-in-out infinite alternate;
      }
      .stretch-body-anim {
        animation: stretch-breathe 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <g id="dog-content" class="stretch-body-anim" filter="url(#dog-outline)">
    <!-- Tail (High in the air wagging happily) -->
    <g class="stretch-tail">
      <rect x="47" y="21" width="3" height="4" fill="#2C2F36"/>
      <rect x="49" y="17" width="3" height="4" fill="#454952"/>
      <rect x="50" y="13" width="3" height="4" fill="#9197A3"/>
      <rect x="51" y="9" width="3" height="4" fill="#ECEFF4"/>
    </g>

    <!-- Rear Body (Arched high) -->
    <rect x="33" y="22" width="16" height="18" fill="#454952"/>
    <rect x="36" y="20" width="12" height="4" fill="#34373D"/>

    <!-- Hind Legs (Standing tall pushing up) -->
    <rect x="41" y="38" width="5" height="11" fill="#34373D"/>
    <rect x="41" y="49" width="6" height="3" fill="#D6D9E0"/>
    <rect x="46" y="37" width="5" height="12" fill="#2C2F36"/>
    <rect x="46" y="49" width="6" height="3" fill="#D6D9E0"/>

    <!-- Slanted Mid-Back (Down towards front) -->
    <rect x="23" y="26" width="12" height="16" fill="#454952"/>
    <rect x="25" y="25" width="10" height="3" fill="#34373D"/>
    <!-- Chest on floor -->
    <rect x="17" y="32" width="10" height="12" fill="#D6D9E0"/>
    <rect x="18" y="34" width="8" height="8" fill="#ECEFF4"/>

    <!-- Front Plush Paws (Stretched straight out forward on floor) -->
    <rect x="3" y="44" width="18" height="4" fill="#454952"/>
    <rect x="2" y="46" width="12" height="3" fill="#D6D9E0"/>
    <rect x="0" y="47" width="8" height="3" fill="#FFFFFF"/>

    <rect x="5" y="41" width="16" height="4" fill="#34373D"/>
    <rect x="4" y="43" width="10" height="3" fill="#D6D9E0"/>
    <rect x="3" y="44" width="6" height="3" fill="#ECEFF4"/>

    <!-- Head (Down between paws, looking forward happily) -->
    <g transform="translate(4, 20)">
      <!-- Left Ear (resting back with fawn tip) -->
      <rect x="11" y="3" width="5" height="4" fill="#2C2F36"/>
      <rect x="10" y="6" width="5" height="4" fill="#454952"/>
      <rect x="9" y="5" width="2" height="5" fill="#D6C3AB"/>
      <rect x="10" y="8" width="3" height="2" fill="#B39F87"/>

      <!-- Head Base -->
      <rect x="14" y="5" width="14" height="14" fill="#454952"/>
      <rect x="16" y="4" width="11" height="3" fill="#34373D"/>

      <!-- Eyebrows (Relaxed happy stretch) -->
      <rect x="13" y="7" width="6" height="3" fill="#D6D9E0"/>
      <rect x="14" y="6" width="4" height="2" fill="#ECEFF4"/>
      <rect x="21" y="7" width="6" height="3" fill="#D6D9E0"/>
      <rect x="22" y="6" width="4" height="2" fill="#ECEFF4"/>

      <!-- Eyes (Happy closed crescent eyes ^ ^) -->
      <rect x="15" y="10" width="4" height="1" fill="#141517"/>
      <rect x="14" y="11" width="1" height="1" fill="#141517"/>
      <rect x="19" y="11" width="1" height="1" fill="#141517"/>

      <rect x="22" y="10" width="4" height="1" fill="#141517"/>
      <rect x="21" y="11" width="1" height="1" fill="#141517"/>
      <rect x="26" y="11" width="1" height="1" fill="#141517"/>

      <!-- Nose -->
      <rect x="18" y="12" width="5" height="2" fill="#141517"/>

      <!-- Beard (Resting on paws) -->
      <rect x="15" y="14" width="10" height="4" fill="#D6D9E0"/>
      <rect x="14" y="16" width="12" height="4" fill="#ECEFF4"/>
      <rect x="15" y="19" width="10" height="4" fill="#FFFFFF"/>
      <rect x="16" y="22" width="8" height="2" fill="#FFFFFF"/>
      <rect x="13" y="17" width="2" height="3" fill="#D6C3AB"/>
      <rect x="25" y="17" width="2" height="3" fill="#D6C3AB"/>
    </g>
  </g>
</svg>
