<svg width="50" height="64" viewBox="-2 -2 50 64" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="dog-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes dog-dangle-legs {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(4deg); }
      }
      @keyframes dog-dangle-tail {
        0%, 100% { transform: rotate(-12deg); }
        50% { transform: rotate(15deg); }
      }
      .dangle-fl {
        transform-origin: 17px 29px;
        animation: dog-dangle-legs 0.45s ease-in-out infinite alternate;
      }
      .dangle-fr {
        transform-origin: 29px 29px;
        animation: dog-dangle-legs 0.45s ease-in-out infinite alternate-reverse;
      }
      .dangle-bl {
        transform-origin: 18px 46px;
        animation: dog-dangle-legs 0.5s ease-in-out infinite alternate;
      }
      .dangle-br {
        transform-origin: 28px 46px;
        animation: dog-dangle-legs 0.5s ease-in-out infinite alternate-reverse;
      }
      .dangle-tail {
        transform-origin: 34px 44px;
        animation: dog-dangle-tail 0.3s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <g id="dog-content" filter="url(#dog-outline)">
    <!-- Scruff fold (Held at top of neck) -->
    <rect x="21" y="14" width="4" height="3" fill="#2C2F36"/>
    <rect x="20" y="16" width="6" height="2" fill="#141517"/>

    <!-- Tail (Dangling / swinging) -->
    <g class="dangle-tail">
      <rect x="33" y="44" width="3" height="3" fill="#2C2F36"/>
      <rect x="35" y="42" width="3" height="3" fill="#454952"/>
      <rect x="36" y="39" width="3" height="4" fill="#9197A3"/>
      <rect x="37" y="36" width="2" height="4" fill="#ECEFF4"/>
    </g>

    <!-- Back Left Leg (Dangling down) -->
    <g class="dangle-bl">
      <rect x="16" y="44" width="4" height="8" fill="#34373D"/>
      <rect x="15" y="52" width="5" height="4" fill="#D6D9E0"/>
      <rect x="15" y="56" width="5" height="2" fill="#FFFFFF"/>
    </g>

    <!-- Back Right Leg (Dangling down) -->
    <g class="dangle-br">
      <rect x="26" y="44" width="4" height="8" fill="#34373D"/>
      <rect x="26" y="52" width="5" height="4" fill="#D6D9E0"/>
      <rect x="26" y="56" width="5" height="2" fill="#FFFFFF"/>
    </g>

    <!-- Body (Elongated suspended torso) -->
    <rect x="16" y="24" width="14" height="23" fill="#454952"/>
    <rect x="18" y="25" width="10" height="20" fill="#34373D"/>
    <!-- Chest fur & salt-pepper highlights -->
    <rect x="19" y="27" width="8" height="15" fill="#767C87"/>
    <rect x="20" y="30" width="6" height="9" fill="#D6D9E0"/>
    <rect x="21" y="32" width="4" height="6" fill="#ECEFF4"/>

    <!-- Front Left Plush Leg (Dangling forward) -->
    <g class="dangle-fl">
      <rect x="14" y="28" width="5" height="10" fill="#454952"/>
      <rect x="13" y="38" width="6" height="4" fill="#D6D9E0"/>
      <rect x="13" y="42" width="6" height="2" fill="#FFFFFF"/>
      <rect x="15" y="37" width="1" height="3" fill="#B39F87"/>
    </g>

    <!-- Front Right Plush Leg (Dangling forward) -->
    <g class="dangle-fr">
      <rect x="27" y="28" width="5" height="10" fill="#454952"/>
      <rect x="27" y="38" width="6" height="4" fill="#D6D9E0"/>
      <rect x="27" y="42" width="6" height="2" fill="#FFFFFF"/>
      <rect x="29" y="37" width="1" height="3" fill="#B39F87"/>
    </g>

    <!-- Head (Curious puppy suspended in midair) -->
    <g transform="translate(0, 3)">
      <!-- Left Ear with fawn tip -->
      <rect x="10" y="8" width="4" height="3" fill="#2C2F36"/>
      <rect x="9" y="11" width="4" height="4" fill="#454952"/>
      <rect x="8" y="10" width="2" height="5" fill="#D6C3AB"/>
      <rect x="9" y="13" width="3" height="3" fill="#D6C3AB"/>
      <rect x="10" y="15" width="2" height="2" fill="#B39F87"/>

      <!-- Right Ear with fawn tip -->
      <rect x="32" y="8" width="4" height="3" fill="#2C2F36"/>
      <rect x="33" y="11" width="4" height="4" fill="#454952"/>
      <rect x="36" y="10" width="2" height="5" fill="#D6C3AB"/>
      <rect x="34" y="13" width="3" height="3" fill="#D6C3AB"/>
      <rect x="34" y="15" width="2" height="2" fill="#B39F87"/>

      <!-- Head Base -->
      <rect x="13" y="7" width="20" height="16" fill="#454952"/>
      <rect x="15" y="6" width="16" height="3" fill="#34373D"/>
      <rect x="17" y="5" width="12" height="2" fill="#2C2F36"/>

      <!-- Forehead Salt & Pepper -->
      <rect x="21" y="7" width="4" height="4" fill="#767C87"/>

      <!-- Bushy Silvery Eyebrows (Perked / arched up) -->
      <rect x="13" y="9" width="7" height="3" fill="#D6D9E0"/>
      <rect x="14" y="8" width="5" height="2" fill="#ECEFF4"/>
      <rect x="15" y="7" width="3" height="1" fill="#FFFFFF"/>

      <rect x="26" y="9" width="7" height="3" fill="#D6D9E0"/>
      <rect x="27" y="8" width="5" height="2" fill="#ECEFF4"/>
      <rect x="28" y="7" width="3" height="1" fill="#FFFFFF"/>

      <!-- Round Dark Puppy Eyes (Looking down with wonder) -->
      <rect x="15" y="12" width="5" height="4" fill="#141517" rx="0.5"/>
      <rect x="16" y="13" width="3" height="3" fill="#1C1613"/>
      <rect x="16" y="12" width="1" height="1" fill="#FFFFFF"/><!-- Glint -->

      <rect x="26" y="12" width="5" height="4" fill="#141517" rx="0.5"/>
      <rect x="27" y="13" width="3" height="3" fill="#1C1613"/>
      <rect x="27" y="12" width="1" height="1" fill="#FFFFFF"/><!-- Glint -->

      <!-- Button Nose -->
      <rect x="20" y="14" width="6" height="3" fill="#141517" rx="1"/>

      <!-- Distinctive Fluffy Rounded Beard -->
      <rect x="16" y="16" width="14" height="4" fill="#D6D9E0"/>
      <rect x="15" y="18" width="16" height="5" fill="#ECEFF4"/>
      <rect x="16" y="21" width="14" height="5" fill="#FFFFFF"/>
      <rect x="17" y="25" width="12" height="4" fill="#FFFFFF"/>
      <rect x="19" y="28" width="8" height="2" fill="#ECEFF4"/>
      <rect x="14" y="19" width="2" height="3" fill="#D6C3AB"/>
      <rect x="30" y="19" width="2" height="3" fill="#D6C3AB"/>
    </g>
  </g>
</svg>
