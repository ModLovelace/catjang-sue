<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="dog-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="dog-content" filter="url(#dog-outline)" transform="translate(0, 4)">
    <!-- Tail (Low, coiled ready to spring) -->
    <rect x="27" y="24" width="3" height="3" fill="#2C2F36"/>
    <rect x="29" y="22" width="3" height="3" fill="#454952"/>
    <rect x="31" y="20" width="3" height="3" fill="#ECEFF4"/>

    <!-- Crouched Body -->
    <rect x="12" y="21" width="17" height="13" fill="#34373D"/>
    <rect x="15" y="19" width="12" height="3" fill="#2C2F36"/>
    <rect x="10" y="23" width="5" height="9" fill="#D6D9E0"/>

    <!-- Crouched Plush Column Legs -->
    <rect x="9" y="31" width="6" height="5" fill="#454952"/>
    <rect x="8" y="33" width="7" height="3" fill="#D6D9E0"/>
    <rect x="8" y="35" width="7" height="2" fill="#FFFFFF"/>
    <rect x="22" y="31" width="6" height="5" fill="#34373D"/>
    <rect x="22" y="34" width="6" height="3" fill="#D6D9E0"/>

    <!-- Crouched Head & Toto Face -->
    <!-- Ears with fawn tips -->
    <rect x="5" y="10" width="4" height="3" fill="#2C2F36"/>
    <rect x="4" y="12" width="5" height="4" fill="#454952"/>
    <rect x="3" y="12" width="2" height="5" fill="#D6C3AB"/>
    <rect x="4" y="15" width="4" height="3" fill="#D6C3AB"/>
    <rect x="5" y="17" width="2" height="2" fill="#B39F87"/>

    <rect x="19" y="10" width="4" height="3" fill="#2C2F36"/>
    <rect x="19" y="12" width="5" height="4" fill="#454952"/>
    <rect x="23" y="12" width="2" height="5" fill="#D6C3AB"/>
    <rect x="20" y="15" width="4" height="3" fill="#D6C3AB"/>
    <rect x="20" y="17" width="2" height="2" fill="#B39F87"/>

    <!-- Head -->
    <rect x="8" y="12" width="12" height="11" fill="#454952"/>
    <rect x="7" y="14" width="14" height="9" fill="#34373D"/>
    <rect x="9" y="11" width="10" height="2" fill="#2C2F36"/>

    <!-- Eyebrows (Excited crouch, angled) -->
    <rect x="6" y="13" width="6" height="3" fill="#D6D9E0"/>
    <rect x="7" y="12" width="4" height="2" fill="#ECEFF4"/>
    <rect x="16" y="13" width="6" height="3" fill="#D6D9E0"/>
    <rect x="17" y="12" width="4" height="2" fill="#ECEFF4"/>

    <!-- Eyes looking up eagerly -->
    <rect x="8" y="15" width="4" height="3" fill="#141517" rx="0.5"/>
    <rect x="9" y="15" width="2" height="2" fill="#1C1613"/>
    <rect x="8" y="15" width="1" height="1" fill="#FFFFFF"/>

    <rect x="16" y="15" width="4" height="3" fill="#141517" rx="0.5"/>
    <rect x="17" y="15" width="2" height="2" fill="#1C1613"/>
    <rect x="16" y="15" width="1" height="1" fill="#FFFFFF"/>

    <!-- Nose & Rounded Beard -->
    <rect x="11" y="17" width="6" height="3" fill="#141517" rx="1"/>
    <rect x="8" y="19" width="12" height="4" fill="#D6D9E0"/>
    <rect x="7" y="20" width="14" height="4" fill="#ECEFF4"/>
    <rect x="8" y="23" width="12" height="3" fill="#FFFFFF"/>
    <rect x="9" y="25" width="10" height="2" fill="#FFFFFF"/>
    <rect x="6" y="20" width="2" height="3" fill="#D6C3AB"/>
    <rect x="20" y="20" width="2" height="3" fill="#D6C3AB"/>
  </g>
</svg>
