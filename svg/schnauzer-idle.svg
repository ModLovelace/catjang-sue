<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -10 50 50" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      :root {
        --dog-color: #555555;
        --dog-dark: #333333;
        --dog-light: #E0E0E0;
        --dog-nose: #1A1A1A;
        --dog-outline: #FFFFFF;
      }

      .breathe-anim { transform-origin: 16px 22px; animation: dog-breathe 3s infinite ease-in-out; }
      .tail-wag { transform-origin: 24px 28px; animation: dog-tail-wag 1.6s infinite ease-in-out; }
      .ear-twitch-l { transform-origin: 7px 7px; animation: dog-ear-l 7s infinite; }
      .ear-twitch-r { transform-origin: 21px 7px; animation: dog-ear-r 8.5s infinite; }

      @keyframes dog-breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.96) translateY(0.4px); }
      }
      @keyframes dog-tail-wag {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(18deg); }
        75% { transform: rotate(-12deg); }
      }
      @keyframes dog-ear-l {
        0%, 92%, 100% { transform: rotate(0deg); }
        94% { transform: rotate(-8deg); }
        97% { transform: rotate(4deg); }
      }
      @keyframes dog-ear-r {
        0%, 90%, 100% { transform: rotate(0deg); }
        93% { transform: rotate(8deg); }
        96% { transform: rotate(-4deg); }
      }
      @keyframes dog-blink {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
      }

      .eye-l-blink, .eye-r-blink {
        transform-box: fill-box;
        transform-origin: center;
      }
      :root.blinking .eye-l-blink,
      :root.blinking .eye-r-blink {
        animation: dog-blink 0.18s ease-in-out forwards;
      }
      :root.sleeping .eye-l-blink,
      :root.sleeping .eye-r-blink {
        transform: scaleY(0.1);
      }
      :root.purring .tail-wag {
        animation: dog-tail-wag 0.25s infinite ease-in-out;
      }
      .pupil-left, .pupil-right {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.22s ease-out;
      }

      /* Outline filter for retro crisp pixel dog */
      #dog-content {
        filter: drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff);
      }
    </style>
  </defs>

  <g id="dog-content">
    <!-- Tail (Wagging behind body) -->
    <g class="tail-wag">
      <rect x="25" y="27" width="2" height="3" fill="#333333"/>
      <rect x="27" y="25" width="2" height="3" fill="#444444"/>
      <rect x="28" y="22" width="3" height="4" fill="#E0E0E0"/>
      <rect x="29" y="20" width="2" height="3" fill="#FFFFFF"/>
    </g>

    <!-- Body Group -->
    <g class="breathe-anim">
      <!-- Back & Body Coat (Salt and pepper) -->
      <rect x="13" y="18" width="13" height="15" fill="#444444"/>
      <rect x="15" y="17" width="10" height="2" fill="#333333"/>
      <rect x="20" y="19" width="6" height="13" fill="#333333"/>
      <!-- Chest (Lighter beard/chest fur) -->
      <rect x="11" y="20" width="4" height="11" fill="#CCCCCC"/>
      <rect x="12" y="22" width="4" height="8" fill="#E8E8E8"/>

      <!-- Rear Paws / Legs -->
      <rect x="22" y="32" width="4" height="4" fill="#333333"/>
      <rect x="23" y="35" width="4" height="2" fill="#E0E0E0"/>
      
      <!-- Front Legs / Paws -->
      <rect x="11" y="30" width="4" height="6" fill="#444444"/>
      <rect x="11" y="35" width="4" height="2" fill="#E0E0E0"/>
      <rect x="16" y="30" width="4" height="6" fill="#555555"/>
      <rect x="16" y="35" width="4" height="2" fill="#E0E0E0"/>
    </g>

    <!-- Head & Distinct Schnauzer Face -->
    <g id="face-js">
      <!-- Ears (Folded Terrier Ears) -->
      <g class="ear-twitch-l">
        <rect x="5" y="4" width="5" height="3" fill="#333333"/>
        <rect x="4" y="7" width="4" height="5" fill="#444444"/>
        <rect x="5" y="11" width="3" height="2" fill="#333333"/>
      </g>
      <g class="ear-twitch-r">
        <rect x="18" y="4" width="5" height="3" fill="#333333"/>
        <rect x="20" y="7" width="4" height="5" fill="#444444"/>
        <rect x="20" y="11" width="3" height="2" fill="#333333"/>
      </g>

      <!-- Head Base -->
      <rect x="8" y="6" width="12" height="13" fill="#555555"/>
      <rect x="7" y="9" width="14" height="10" fill="#444444"/>

      <!-- Bushy Schnauzer Eyebrows (Prominent light arches) -->
      <g id="eyebrows">
        <rect x="6" y="8" width="6" height="3" fill="#E8E8E8"/>
        <rect x="7" y="7" width="4" height="2" fill="#FFFFFF"/>
        <rect x="16" y="8" width="6" height="3" fill="#E8E8E8"/>
        <rect x="17" y="7" width="4" height="2" fill="#FFFFFF"/>
      </g>

      <!-- Eye Left -->
      <g id="eye-left" class="eye-l-blink">
        <rect x="8" y="11" width="4" height="3" fill="#FFFFFF"/>
        <!-- Pupil -->
        <rect id="pupil-left" class="pupil-left" x="9" y="11" width="2" height="3" fill="#1A1A1A"/>
        <rect x="9" y="11" width="1" height="1" fill="#FFFFFF"/><!-- Glint -->
      </g>

      <!-- Eye Right -->
      <g id="eye-right" class="eye-r-blink">
        <rect x="16" y="11" width="4" height="3" fill="#FFFFFF"/>
        <!-- Pupil -->
        <rect id="pupil-right" class="pupil-right" x="17" y="11" width="2" height="3" fill="#1A1A1A"/>
        <rect x="17" y="11" width="1" height="1" fill="#FFFFFF"/><!-- Glint -->
      </g>

      <!-- Schnauzer Snout, Nose & Long Signature Beard -->
      <!-- Bridge of nose -->
      <rect x="12" y="11" width="4" height="3" fill="#3A3A3A"/>
      <!-- Nose Button -->
      <rect x="12" y="13" width="4" height="2" fill="#111111"/>
      <!-- Tongue (hidden normally, shows when purring/happy) -->
      <rect id="dog-tongue" x="13" y="18" width="3" height="3" fill="#FF7799" rx="1" style="display:none;"/>
      <!-- Signature Beard (Full bushy white/grey beard) -->
      <g id="beard">
        <rect x="9" y="14" width="10" height="4" fill="#E0E0E0"/>
        <rect x="8" y="15" width="12" height="4" fill="#EEEEEE"/>
        <rect x="9" y="18" width="10" height="4" fill="#FFFFFF"/>
        <rect x="10" y="21" width="8" height="3" fill="#FFFFFF"/>
        <rect x="11" y="23" width="6" height="2" fill="#E8E8E8"/>
        <!-- Mustache side tufts -->
        <rect x="7" y="16" width="2" height="3" fill="#D0D0D0"/>
        <rect x="19" y="16" width="2" height="3" fill="#D0D0D0"/>
      </g>
    </g>
  </g>
</svg>
