<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 50" width="50" height="50" shape-rendering="crispEdges">
  <defs>
    <filter id="dog-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="dog-content" filter="url(#dog-outline)" transform="translate(0, -3)">
    <!-- Tail (flying up happily) -->
    <rect x="29" y="11" width="3" height="4" fill="#FFFFFF"/>
    <rect x="28" y="15" width="3" height="4" fill="#E0E0E0"/>
    <rect x="26" y="19" width="3" height="4" fill="#444444"/>

    <!-- Body in Leap -->
    <rect x="13" y="16" width="16" height="14" fill="#444444"/>
    <rect x="16" y="14" width="10" height="3" fill="#333333"/>
    <rect x="11" y="19" width="5" height="9" fill="#CCCCCC"/>

    <!-- Front Paws Extended Forward/Down -->
    <rect x="7" y="27" width="5" height="7" fill="#444444"/>
    <rect x="7" y="33" width="5" height="3" fill="#E0E0E0"/>
    <rect x="14" y="27" width="5" height="7" fill="#555555"/>
    <rect x="14" y="33" width="5" height="3" fill="#E0E0E0"/>

    <!-- Back Paws Extended Backward -->
    <rect x="25" y="26" width="5" height="7" fill="#333333"/>
    <rect x="26" y="32" width="5" height="3" fill="#E0E0E0"/>

    <!-- Flying Ears (Raised in joy) -->
    <rect x="4" y="3" width="5" height="4" fill="#444444"/>
    <rect x="3" y="6" width="4" height="4" fill="#333333"/>
    <rect x="20" y="3" width="5" height="4" fill="#444444"/>
    <rect x="22" y="6" width="4" height="4" fill="#333333"/>

    <!-- Head -->
    <rect x="8" y="6" width="13" height="12" fill="#555555"/>
    <rect x="7" y="9" width="15" height="9" fill="#444444"/>

    <!-- Eyebrows High -->
    <rect x="6" y="7" width="6" height="3" fill="#E8E8E8"/>
    <rect x="7" y="6" width="4" height="2" fill="#FFFFFF"/>
    <rect x="17" y="7" width="6" height="3" fill="#E8E8E8"/>
    <rect x="18" y="6" width="4" height="2" fill="#FFFFFF"/>

    <!-- Eyes (Happy Arches / Big Eyes) -->
    <rect x="8" y="10" width="4" height="3" fill="#FFFFFF"/>
    <rect x="9" y="10" width="2" height="3" fill="#1A1A1A"/>
    <rect x="17" y="10" width="4" height="3" fill="#FFFFFF"/>
    <rect x="18" y="10" width="2" height="3" fill="#1A1A1A"/>

    <!-- Snout & Beard -->
    <rect x="12" y="12" width="4" height="2" fill="#111111"/>
    <!-- Big Happy Tongue -->
    <rect x="13" y="17" width="4" height="4" fill="#FF7799" rx="1"/>
    <rect x="14" y="20" width="2" height="2" fill="#FF5577"/>

    <rect x="9" y="14" width="11" height="4" fill="#E0E0E0"/>
    <rect x="8" y="15" width="13" height="4" fill="#EEEEEE"/>
    <rect x="9" y="18" width="11" height="4" fill="#FFFFFF"/>
    <rect x="10" y="21" width="9" height="3" fill="#FFFFFF"/>
  </g>
</svg>
