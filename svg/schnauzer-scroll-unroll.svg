<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <filter id="dog-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="#FFFFFF" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="paper-strip-clip">
      <rect id="paper-strip-mask" x="5" y="13" width="11" height="17"/>
    </clipPath>

    <style>
      @keyframes speed-line-a {
        0% { opacity: 0; transform: translateY(-2px); }
        20%, 65% { opacity: 1; }
        100% { opacity: 0; transform: translateY(5px); }
      }
      @keyframes speed-line-b {
        0% { opacity: 0; transform: translateY(1px); }
        20%, 70% { opacity: 1; }
        100% { opacity: 0; transform: translateY(7px); }
      }
      .speed-a {
        animation: speed-line-a 0.34s steps(3, end) infinite;
      }
      .speed-b {
        animation: speed-line-b 0.34s steps(3, end) infinite;
        animation-delay: 0.08s;
      }
      @keyframes scroll-ear-left {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(6deg) translateY(-1px); }
      }
      @keyframes scroll-ear-right {
        0%, 100% { transform: rotate(3deg); }
        50% { transform: rotate(-6deg) translateY(-1px); }
      }
      .scroll-ear-l {
        transform-origin: 23px 8px;
        animation: scroll-ear-left 0.25s steps(2, end) infinite;
      }
      .scroll-ear-r {
        transform-origin: 36px 8px;
        animation: scroll-ear-right 0.25s steps(2, end) infinite;
      }
    </style>
  </defs>

  <!-- Paper Roll on the left -->
  <path d="M13 13H3V14H2V15H1V22H2V23H3V24H4V25H13V24H14V22H15V21H16V17H15V15H14V14H13V13Z" fill="#D9D9D9" stroke="black"/>
  <path d="M8 22H7V23H6V25" stroke="black"/>
  <path id="paper-strip" class="paper-strip" d="M13 13H5V15H6V16H7V17H8V45.5H16V17H15V15H14V14H13V13Z" fill="#D9D9D9" stroke="black" clip-path="url(#paper-strip-clip)"/>

  <!-- Speed lines -->
  <g class="speed-a">
    <path d="M5 29V34.5" stroke="black"/>
    <path d="M18 34V38" stroke="black"/>
  </g>
  <g class="speed-b">
    <path d="M11.5 24V28" stroke="black"/>
    <path d="M14 38V42" stroke="black"/>
  </g>

  <!-- Schnauzer Body & Actions -->
  <g id="dog-content" filter="url(#dog-outline)">
    <!-- Wagging Tail -->
    <g transform="translate(36, 30)">
      <animateTransform attributeName="transform" type="rotate" values="10 36 30; -20 36 30; 10 36 30" dur="0.18s" repeatCount="indefinite"/>
      <rect x="0" y="-3" width="3" height="4" fill="#333333"/>
      <rect x="2" y="-6" width="3" height="4" fill="#E0E0E0"/>
      <rect x="3" y="-9" width="2" height="4" fill="#FFFFFF"/>
    </g>

    <!-- Body -->
    <rect x="22" y="24" width="16" height="15" fill="#444444"/>
    <rect x="25" y="22" width="12" height="3" fill="#333333"/>
    <rect x="20" y="26" width="5" height="10" fill="#CCCCCC"/>
    <!-- Back Paws -->
    <rect x="33" y="38" width="6" height="4" fill="#333333"/>
    <rect x="34" y="41" width="5" height="2" fill="#E0E0E0"/>

    <!-- Left Paw Furiously Rolling Paper (alternating) -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="rotate" values="24 26 26; -18 26 26; 24 26 26" dur="0.16s" repeatCount="indefinite"/>
      <rect x="18" y="22" width="6" height="11" fill="#444444"/>
      <rect x="16" y="29" width="6" height="4" fill="#E8E8E8"/>
      <rect x="15" y="32" width="6" height="2" fill="#FFFFFF"/>
    </g>

    <!-- Right Paw Furiously Rolling Paper (alternating) -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="rotate" values="-18 30 27; 24 30 27; -18 30 27" dur="0.16s" repeatCount="indefinite"/>
      <rect x="21" y="23" width="6" height="11" fill="#555555"/>
      <rect x="19" y="30" width="6" height="4" fill="#E8E8E8"/>
      <rect x="18" y="33" width="6" height="2" fill="#FFFFFF"/>
    </g>

    <!-- Head & Face (Facing left toward paper roll) -->
    <g transform="translate(14, 2)">
      <!-- Ears with motion -->
      <g class="scroll-ear-l">
        <rect x="7" y="4" width="5" height="4" fill="#333333"/>
        <rect x="6" y="7" width="4" height="4" fill="#444444"/>
      </g>
      <g class="scroll-ear-r">
        <rect x="18" y="4" width="5" height="4" fill="#333333"/>
        <rect x="20" y="7" width="4" height="4" fill="#444444"/>
      </g>

      <!-- Head Base -->
      <rect x="9" y="6" width="12" height="12" fill="#555555"/>
      <rect x="7" y="9" width="14" height="9" fill="#444444"/>

      <!-- Bushy Eyebrows (Focused forward) -->
      <rect x="6" y="8" width="6" height="3" fill="#E8E8E8"/>
      <rect x="7" y="7" width="4" height="2" fill="#FFFFFF"/>
      <rect x="16" y="8" width="6" height="3" fill="#E8E8E8"/>
      <rect x="17" y="7" width="4" height="2" fill="#FFFFFF"/>

      <!-- Eyes (Excited focus on paper) -->
      <rect x="8" y="11" width="4" height="3" fill="#FFFFFF"/>
      <rect x="8" y="11" width="2" height="3" fill="#1A1A1A"/><!-- Looking left -->
      <rect x="16" y="11" width="4" height="3" fill="#FFFFFF"/>
      <rect x="16" y="11" width="2" height="3" fill="#1A1A1A"/><!-- Looking left -->

      <!-- Snout, Nose & Beard -->
      <rect x="11" y="12" width="4" height="2" fill="#111111"/>
      <!-- Happy Tongue Out -->
      <rect x="10" y="16" width="3" height="3" fill="#FF7799" rx="1"/>
      <rect x="8" y="14" width="10" height="4" fill="#E0E0E0"/>
      <rect x="7" y="15" width="12" height="4" fill="#EEEEEE"/>
      <rect x="8" y="18" width="10" height="4" fill="#FFFFFF"/>
      <rect x="9" y="21" width="8" height="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
